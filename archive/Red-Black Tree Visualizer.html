    <title>Red-Black Tree Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8f9fa;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);

        .control-panel {
            display: flex;

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);

        .btn-secondary {
            background: #f8f9fa;
            color: #495057;
            border: 2px solid #dee2e6;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;

            transition: all 0.3s ease;

        .btn-secondary:hover:not(:disabled) {

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .info-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;

        .info-item {
            text-align: center;

            background: white;

        .info-item .label {

            font-weight: 400;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-item .value {
            font-size: 18px;
            font-weight: 700;
            color: #333;
            margin-top: 5px;
        }

        .visualization {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            min-height: 400px;
            position: relative;
            overflow: hidden;
        }

        .tree-container {
            width: 100%;
            height: 400px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 20px;
        }

        .tree-node {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.5s ease;
            cursor: pointer;
            border: 3px solid white;
            z-index: 10;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);

        .tree-node.red {
            background: #dc3545;
        }

        .tree-node.black {
            background: #343a40;
        }

        .tree-node.nil {
            background: #6c757d;
            width: 20px;
            height: 20px;
            opacity: 0.3;
        }

        .tree-node.current {
            transform: scale(1.2);
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.8);

        .tree-node.violating {

        .tree-node.rotating {

            animation: spin 1s ease-in-out;
        }

        .tree-node.fixed {
            background: linear-gradient(135deg, #26de81, #20bf6b);
            transform: scale(1.1);
            animation: pulse 1s ease-in-out;
        }

        .tree-edge {

        @keyframes pulse {

        @keyframes shake {

        @keyframes spin {
            0% { transform: scale(1.15) rotate(0deg); }
            100% { transform: scale(1.15) rotate(360deg); }
        }

        @media (max-width: 768px) {
            .container {

            .control-panel {

            }
            
            .info-panel {
                grid-template-columns: 1fr;
            }
            
            .tree-container {

<body>
    <div class="container">
        <div class="control-panel">
            <div class="input-group">
                <label for="valueInput">Value</label>
                <input type="number" id="valueInput" placeholder="Enter value">
            </div>
            <div class="input-group">
                <label for="operationSelect">Operation</label>
                <select id="operationSelect">
                    <option value="insert">Insert</option>
                    <option value="delete">Delete</option>
                    <option value="search">Search</option>
                </select>
            </div>
            <button class="btn-primary" id="executeBtn">Execute</button>
            <button class="btn-secondary" id="resetBtn">Reset Tree</button>
        </div>

        <div class="info-panel">
            <div class="info-item">
                <div class="label">Algorithm</div>
                <div class="value">Red-Black Tree</div>
            </div>
            <div class="info-item">
                <div class="label">Step</div>
                <div class="value" id="stepCounter">0 / 0</div>
            </div>
            <div class="info-item">
                <div class="label">Time Complexity</div>
                <div class="value" id="timeComplexity">O(log n)</div>
            </div>
            <div class="info-item">
                <div class="label">Space Complexity</div>
                <div class="value">O(n)</div>
            </div>
        </div>



        <div class="step-info">
            <div class="description" id="stepDescription">Select an operation and enter a value to begin</div>
        </div>

        <div class="visualization">
            <div class="tree-container" id="treeContainer"></div>
        </div>

        <div class="navigation">
            <button class="btn-secondary" id="prevBtn" disabled="">Previous</button>
            <button class="btn-secondary" id="nextBtn" disabled="">Next</button>
        </div>
    </div>

    <script>
        class RBNode {
            constructor(value, color = 'red') {
                this.value = value;
                this.color = color; // 'red' or 'black'
                this.left = null;
                this.right = null;
                this.parent = null;
                this.id = Math.random().toString(36).substr(2, 9);
                this.isNil = false;
            }
        }

        class RBTreeVisualizer {
            constructor() {
                this.root = null;
                this.nil = this.createNilNode();
                this.steps = [];
                this.currentStep = 0;
                this.nodePositions = new Map();
                this.animationInProgress = false;
                
                this.initializeEventListeners();
                this.updateUI();
            }

            createNilNode() {
                const nil = new RBNode(null, 'black');
                nil.isNil = true;
                return nil;
            }

            initializeEventListeners() {
                const executeBtn = document.getElementById('executeBtn');
                const resetBtn = document.getElementById('resetBtn');
                const prevBtn = document.getElementById('prevBtn');
                const nextBtn = document.getElementById('nextBtn');
                const valueInput = document.getElementById('valueInput');

                if (executeBtn) executeBtn.addEventListener('click', () => this.executeOperation());
                if (resetBtn) resetBtn.addEventListener('click', () => this.resetTree());
                if (prevBtn) prevBtn.addEventListener('click', () => this.previousStep());
                if (nextBtn) nextBtn.addEventListener('click', () => this.nextStep());
                
                if (valueInput) {
                    valueInput.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter') this.executeOperation();
                    });
                }

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowLeft') this.previousStep();
                    if (e.key === 'ArrowRight') this.nextStep();
                });
            }

            executeOperation() {
                if (this.animationInProgress) return;
                
                const valueInput = document.getElementById('valueInput');
                const operationSelect = document.getElementById('operationSelect');
                
                if (!valueInput || !operationSelect) return;
                
                const value = parseInt(valueInput.value);
                const operation = operationSelect.value;
                
                if (isNaN(value)) {
                    alert('Please enter a valid number');
                    return;
                }

                this.steps = [];
                this.currentStep = 0;
                
                switch (operation) {
                    case 'insert':
                        this.insertValue(value);
                        break;
                    case 'delete':
                        this.deleteValue(value);
                        break;
                    case 'search':
                        this.searchValue(value);
                        break;
                }
                
                this.updateUI();
                valueInput.value = '';
            }

            insertValue(value) {
                if (this.findNode(this.root, value)) {
                    this.steps.push({
                        type: 'insert',
                        description: `Value ${value} already exists in tree`,
                        tree: this.cloneTree(this.root),
                        currentNode: null,
                        action: 'duplicate'
                    });
                    return;
                }

                const newNode = new RBNode(value, 'red');
                
                if (this.root === null) {
                    this.steps.push({
                        type: 'insert',
                        description: `Inserting ${value} as root (will be colored black)`,
                        tree: null,
                        currentNode: null,
                        action: 'create_root'
                    });
                    
                    this.root = newNode;
                    newNode.color = 'black';
                    newNode.left = this.nil;
                    newNode.right = this.nil;
                    
                    this.steps.push({
                        type: 'insert',
                        description: `Root ${value} created and colored black`,
                        tree: this.cloneTree(this.root),
                        currentNode: newNode.id,
                        action: 'complete'
                    });
                } else {
                    this.bstInsert(newNode);
                    this.insertFixup(newNode);
                }
            }

            bstInsert(newNode) {
                let current = this.root;
                let parent = null;

                this.steps.push({
                    type: 'insert',
                    description: `Starting BST insertion for ${newNode.value}`,
                    tree: this.cloneTree(this.root),
                    currentNode: current ? current.id : null,
                    action: 'start_insertion'
                });

                while (current !== null && !current.isNil) {
                    parent = current;
                    
                    this.steps.push({
                        type: 'insert',
                        description: `Comparing ${newNode.value} with ${current.value}`,
                        tree: this.cloneTree(this.root),
                        currentNode: current.id,
                        action: 'compare'
                    });

                    if (newNode.value < current.value) {
                        current = current.left;
                    } else {
                        current = current.right;
                    }
                }

                newNode.parent = parent;
                newNode.left = this.nil;
                newNode.right = this.nil;

                if (parent === null) {
                    this.root = newNode;
                } else if (newNode.value < parent.value) {
                    parent.left = newNode;
                    this.steps.push({
                        type: 'insert',
                        description: `Inserted ${newNode.value} as left child of ${parent.value}`,
                        tree: this.cloneTree(this.root),
                        currentNode: newNode.id,
                        action: 'inserted'
                    });
                } else {
                    parent.right = newNode;
                    this.steps.push({
                        type: 'insert',
                        description: `Inserted ${newNode.value} as right child of ${parent.value}`,
                        tree: this.cloneTree(this.root),
                        currentNode: newNode.id,
                        action: 'inserted'
                    });
                }
            }

            insertFixup(node) {
                this.steps.push({
                    type: 'insert',
                    description: `Starting Red-Black fixup for ${node.value}`,
                    tree: this.cloneTree(this.root),
                    currentNode: node.id,
                    action: 'start_fixup'
                });

                while (node.parent && node.parent.color === 'red') {
                    this.steps.push({
                        type: 'insert',
                        description: `Red-red violation detected: ${node.value} and ${node.parent.value}`,
                        tree: this.cloneTree(this.root),
                        currentNode: node.id,
                        action: 'violation'
                    });

                    if (node.parent === node.parent.parent.left) {
                        const uncle = node.parent.parent.right;
                        
                        if (uncle && uncle.color === 'red') {
                            // Case 1: Uncle is red
                            this.steps.push({
                                type: 'insert',
                                description: `Case 1: Uncle ${uncle.value} is red - recoloring`,
                                tree: this.cloneTree(this.root),
                                currentNode: node.id,
                                action: 'recolor'
                            });
                            
                            node.parent.color = 'black';
                            uncle.color = 'black';
                            node.parent.parent.color = 'red';
                            node = node.parent.parent;
                            
                            this.steps.push({
                                type: 'insert',
                                description: `Recolored parent and uncle to black, grandparent to red`,
                                tree: this.cloneTree(this.root),
                                currentNode: node.id,
                                action: 'recolored'
                            });
                        } else {
                            if (node === node.parent.right) {
                                // Case 2: Node is right child
                                this.steps.push({
                                    type: 'insert',
                                    description: `Case 2: ${node.value} is right child - left rotation needed`,
                                    tree: this.cloneTree(this.root),
                                    currentNode: node.id,
                                    action: 'prepare_rotation'
                                });
                                
                                node = node.parent;
                                this.leftRotate(node);
                            }
                            // Case 3: Node is left child
                            this.steps.push({
                                type: 'insert',
                                description: `Case 3: Right rotation and recoloring`,
                                tree: this.cloneTree(this.root),
                                currentNode: node.id,
                                action: 'final_rotation'
                            });
                            
                            node.parent.color = 'black';
                            node.parent.parent.color = 'red';
                            this.rightRotate(node.parent.parent);
                        }
                    } else {
                        // Mirror cases
                        const uncle = node.parent.parent.left;
                        
                        if (uncle && uncle.color === 'red') {
                            this.steps.push({
                                type: 'insert',
                                description: `Case 1: Uncle ${uncle.value} is red - recoloring`,
                                tree: this.cloneTree(this.root),
                                currentNode: node.id,
                                action: 'recolor'
                            });
                            
                            node.parent.color = 'black';
                            uncle.color = 'black';
                            node.parent.parent.color = 'red';
                            node = node.parent.parent;
                            
                            this.steps.push({
                                type: 'insert',
                                description: `Recolored parent and uncle to black, grandparent to red`,
                                tree: this.cloneTree(this.root),
                                currentNode: node.id,
                                action: 'recolored'
                            });
                        } else {
                            if (node === node.parent.left) {
                                this.steps.push({
                                    type: 'insert',
                                    description: `Case 2: ${node.value} is left child - right rotation needed`,
                                    tree: this.cloneTree(this.root),
                                    currentNode: node.id,
                                    action: 'prepare_rotation'
                                });
                                
                                node = node.parent;
                                this.rightRotate(node);
                            }
                            
                            this.steps.push({
                                type: 'insert',
                                description: `Case 3: Left rotation and recoloring`,
                                tree: this.cloneTree(this.root),
                                currentNode: node.id,
                                action: 'final_rotation'
                            });
                            
                            node.parent.color = 'black';
                            node.parent.parent.color = 'red';
                            this.leftRotate(node.parent.parent);
                        }
                    }
                }

                this.root.color = 'black';
                this.steps.push({
                    type: 'insert',
                    description: `Fixup complete - root is black, Red-Black properties maintained`,
                    tree: this.cloneTree(this.root),
                    currentNode: null,
                    action: 'complete'
                });
            }

            leftRotate(x) {
                this.steps.push({
                    type: 'rotation',
                    description: `Performing left rotation on ${x.value}`,
                    tree: this.cloneTree(this.root),
                    currentNode: x.id,
                    action: 'rotating'
                });

                const y = x.right;
                x.right = y.left;
                
                if (!y.left.isNil) {
                    y.left.parent = x;
                }
                
                y.parent = x.parent;
                
                if (x.parent === null) {
                    this.root = y;
                } else if (x === x.parent.left) {
                    x.parent.left = y;
                } else {
                    x.parent.right = y;
                }
                
                y.left = x;
                x.parent = y;

                this.steps.push({
                    type: 'rotation',
                    description: `Left rotation on ${x.value} completed`,
                    tree: this.cloneTree(this.root),
                    currentNode: y.id,
                    action: 'rotation_complete'
                });
            }

            rightRotate(y) {
                this.steps.push({
                    type: 'rotation',
                    description: `Performing right rotation on ${y.value}`,
                    tree: this.cloneTree(this.root),
                    currentNode: y.id,
                    action: 'rotating'
                });

                const x = y.left;
                y.left = x.right;
                
                if (!x.right.isNil) {
                    x.right.parent = y;
                }
                
                x.parent = y.parent;
                
                if (y.parent === null) {
                    this.root = x;
                } else if (y === y.parent.right) {
                    y.parent.right = x;
                } else {
                    y.parent.left = x;
                }
                
                x.right = y;
                y.parent = x;

                this.steps.push({
                    type: 'rotation',
                    description: `Right rotation on ${y.value} completed`,
                    tree: this.cloneTree(this.root),
                    currentNode: x.id,
                    action: 'rotation_complete'
                });
            }

            deleteValue(value) {
                const nodeToDelete = this.findNode(this.root, value);
                if (!nodeToDelete) {
                    this.steps.push({
                        type: 'delete',
                        description: `Value ${value} not found in tree`,
                        tree: this.cloneTree(this.root),
                        currentNode: null,
                        action: 'not_found'
                    });
                    return;
                }

                this.steps.push({
                    type: 'delete',
                    description: `Found ${value} - starting deletion`,
                    tree: this.cloneTree(this.root),
                    currentNode: nodeToDelete.id,
                    action: 'found'
                });

                this.rbDelete(nodeToDelete);
            }

            rbDelete(nodeToDelete) {
                let y = nodeToDelete;
                let yOriginalColor = y.color;
                let x;

                if (nodeToDelete.left.isNil) {
                    x = nodeToDelete.right;
                    this.steps.push({
                        type: 'delete',
                        description: `Node has no left child - replacing with right child`,
                        tree: this.cloneTree(this.root),
                        currentNode: nodeToDelete.id,
                        action: 'replace_right'
                    });
                    this.transplant(nodeToDelete, nodeToDelete.right);
                } else if (nodeToDelete.right.isNil) {
                    x = nodeToDelete.left;
                    this.steps.push({
                        type: 'delete',
                        description: `Node has no right child - replacing with left child`,
                        tree: this.cloneTree(this.root),
                        currentNode: nodeToDelete.id,
                        action: 'replace_left'
                    });
                    this.transplant(nodeToDelete, nodeToDelete.left);
                } else {
                    y = this.minimum(nodeToDelete.right);
                    yOriginalColor = y.color;
                    x = y.right;
                    
                    this.steps.push({
                        type: 'delete',
                        description: `Node has two children - found successor ${y.value}`,
                        tree: this.cloneTree(this.root),
                        currentNode: y.id,
                        action: 'successor_found'
                    });

                    if (y.parent === nodeToDelete) {
                        x.parent = y;
                    } else {
                        this.transplant(y, y.right);
                        y.right = nodeToDelete.right;
                        y.right.parent = y;
                    }

                    this.transplant(nodeToDelete, y);
                    y.left = nodeToDelete.left;
                    y.left.parent = y;
                    y.color = nodeToDelete.color;

                    this.steps.push({
                        type: 'delete',
                        description: `Replaced ${nodeToDelete.value} with successor ${y.value}`,
                        tree: this.cloneTree(this.root),
                        currentNode: y.id,
                        action: 'replaced'
                    });
                }

                if (yOriginalColor === 'black') {
                    this.steps.push({
                        type: 'delete',
                        description: `Deleted node was black - starting fixup`,
                        tree: this.cloneTree(this.root),
                        currentNode: x.isNil ? null : x.id,
                        action: 'start_delete_fixup'
                    });
                    this.deleteFixup(x);
                } else {
                    this.steps.push({
                        type: 'delete',
                        description: `Deletion complete - no fixup needed (deleted red node)`,
                        tree: this.cloneTree(this.root),
                        currentNode: null,
                        action: 'complete'
                    });
                }
            }

            deleteFixup(x) {
                while (x !== this.root && x.color === 'black') {
                    if (x === x.parent.left) {
                        let w = x.parent.right;
                        
                        if (w.color === 'red') {
                            this.steps.push({
                                type: 'delete',
                                description: `Case 1: Sibling ${w.value} is red`,
                                tree: this.cloneTree(this.root),
                                currentNode: w.id,
                                action: 'delete_case1'
                            });
                            
                            w.color = 'black';
                            x.parent.color = 'red';
                            this.leftRotate(x.parent);
                            w = x.parent.right;
                        }
                        
                        if (w.left.color === 'black' && w.right.color === 'black') {
                            this.steps.push({
                                type: 'delete',
                                description: `Case 2: Both children of sibling are black`,
                                tree: this.cloneTree(this.root),
                                currentNode: w.id,
                                action: 'delete_case2'
                            });
                            
                            w.color = 'red';
                            x = x.parent;
                        } else {
                            if (w.right.color === 'black') {
                                this.steps.push({
                                    type: 'delete',
                                    description: `Case 3: Right child of sibling is black`,
                                    tree: this.cloneTree(this.root),
                                    currentNode: w.id,
                                    action: 'delete_case3'
                                });
                                
                                w.left.color = 'black';
                                w.color = 'red';
                                this.rightRotate(w);
                                w = x.parent.right;
                            }
                            
                            this.steps.push({
                                type: 'delete',
                                description: `Case 4: Final case - completing fixup`,
                                tree: this.cloneTree(this.root),
                                currentNode: w.id,
                                action: 'delete_case4'
                            });
                            
                            w.color = x.parent.color;
                            x.parent.color = 'black';
                            w.right.color = 'black';
                            this.leftRotate(x.parent);
                            x = this.root;
                        }
                    } else {
                        // Mirror cases for right child
                        let w = x.parent.left;
                        
                        if (w.color === 'red') {
                            w.color = 'black';
                            x.parent.color = 'red';
                            this.rightRotate(x.parent);
                            w = x.parent.left;
                        }
                        
                        if (w.right.color === 'black' && w.left.color === 'black') {
                            w.color = 'red';
                            x = x.parent;
                        } else {
                            if (w.left.color === 'black') {
                                w.right.color = 'black';
                                w.color = 'red';
                                this.leftRotate(w);
                                w = x.parent.left;
                            }
                            
                            w.color = x.parent.color;
                            x.parent.color = 'black';
                            w.left.color = 'black';
                            this.rightRotate(x.parent);
                            x = this.root;
                        }
                    }
                }
                
                x.color = 'black';
                this.steps.push({
                    type: 'delete',
                    description: `Delete fixup complete - Red-Black properties restored`,
                    tree: this.cloneTree(this.root),
                    currentNode: null,
                    action: 'complete'
                });
            }

            transplant(u, v) {
                if (u.parent === null) {
                    this.root = v;
                } else if (u === u.parent.left) {
                    u.parent.left = v;
                } else {
                    u.parent.right = v;
                }
                v.parent = u.parent;
            }

            minimum(node) {
                while (!node.left.isNil) {
                    node = node.left;
                }
                return node;
            }

            searchValue(value) {
                if (this.root === null) {
                    this.steps.push({
                        type: 'search',
                        description: `Cannot search for ${value} - tree is empty`,
                        tree: null,
                        currentNode: null,
                        action: 'empty'
                    });
                    return;
                }

                this.searchRecursive(this.root, value);
            }

            searchRecursive(node, value) {
                if (node === null || node.isNil) {
                    this.steps.push({
                        type: 'search',
                        description: `${value} not found in tree`,
                        tree: this.cloneTree(this.root),
                        currentNode: null,
                        action: 'not_found'
                    });
                    return false;
                }

                this.steps.push({
                    type: 'search',
                    description: `Comparing ${value} with ${node.value}`,
                    tree: this.cloneTree(this.root),
                    currentNode: node.id,
                    action: 'compare'
                });

                if (value === node.value) {
                    this.steps.push({
                        type: 'search',
                        description: `Found ${value}!`,
                        tree: this.cloneTree(this.root),
                        currentNode: node.id,
                        action: 'found'
                    });
                    return true;
                } else if (value < node.value) {
                    return this.searchRecursive(node.left, value);
                } else {
                    return this.searchRecursive(node.right, value);
                }
            }

            findNode(node, value) {
                if (node === null || node.isNil) {
                    return null;
                }
                
                if (value === node.value) {
                    return node;
                } else if (value < node.value) {
                    return this.findNode(node.left, value);
                } else {
                    return this.findNode(node.right, value);
                }
            }

            cloneTree(node) {
                if (node === null || node.isNil) {
                    return null;
                }
                
                const cloned = new RBNode(node.value, node.color);
                cloned.id = node.id;
                cloned.isNil = node.isNil;
                cloned.left = this.cloneTree(node.left);
                cloned.right = this.cloneTree(node.right);
                return cloned;
            }

            resetTree() {
                this.root = null;
                this.steps = [];
                this.currentStep = 0;
                this.nodePositions.clear();
                this.updateUI();
            }

            previousStep() {
                if (this.currentStep > 0) {
                    this.currentStep--;
                    this.updateUI();
                }
            }

            nextStep() {
                if (this.currentStep < this.steps.length - 1) {
                    this.currentStep++;
                    this.updateUI();
                }
            }

            updateUI() {
                // Update step counter
                const stepCounter = document.getElementById('stepCounter');
                if (stepCounter) {
                    stepCounter.textContent = 
                        this.steps.length > 0 ? `${this.currentStep + 1} / ${this.steps.length}` : '0 / 0';
                }

                // Update step description
                const stepDescription = document.getElementById('stepDescription');
                if (stepDescription) {
                    if (this.steps.length === 0) {
                        stepDescription.textContent = 'Select an operation and enter a value to begin';
                    } else {
                        stepDescription.textContent = this.steps[this.currentStep].description;
                    }
                }

                // Update navigation buttons
                const prevBtn = document.getElementById('prevBtn');
                const nextBtn = document.getElementById('nextBtn');
                if (prevBtn) prevBtn.disabled = this.currentStep === 0;
                if (nextBtn) nextBtn.disabled = this.currentStep >= this.steps.length - 1;

                // Update time complexity
                const timeComplexity = document.getElementById('timeComplexity');
                if (timeComplexity) {
                    timeComplexity.textContent = 'O(log n)';
                }

                // Render tree
                this.renderTree();
            }

            renderTree() {
                const container = document.getElementById('treeContainer');
                const emptyState = document.getElementById('emptyState');
                
                if (!container) return;
                
                // Clear previous render
                container.innerHTML = '';
                
                let currentTree = this.root;
                let currentNodeId = null;
                let action = 'normal';
                
                if (this.steps.length > 0) {
                    const currentStepData = this.steps[this.currentStep];
                    currentTree = currentStepData.tree;
                    currentNodeId = currentStepData.currentNode;
                    action = currentStepData.action;
                }
                
                if (currentTree === null) {
                    if (emptyState) {
                        emptyState.style.display = 'block';
                    } else {
                        const emptyDiv = document.createElement('div');
                        emptyDiv.className = 'empty-state';
                        emptyDiv.textContent = 'Tree is empty. Insert a value to get started.';
                        container.appendChild(emptyDiv);
                    }
                    return;
                }
                
                if (emptyState) {
                    emptyState.style.display = 'none';
                }
                
                // Calculate positions
                this.calculatePositions(currentTree, 0, 0, 600, 0);
                
                // Render edges first
                this.renderEdges(currentTree, container);
                
                // Render nodes
                this.renderNodes(currentTree, container, currentNodeId, action);
            }

            calculatePositions(node, x, y, width, depth) {
                if (node === null) return;
                
                const nodeX = x + width / 2;
                const nodeY = y + depth * 80 + 20;
                
                this.nodePositions.set(node.id, { x: nodeX, y: nodeY });
                
                if (node.left && !node.left.isNil) {
                    this.calculatePositions(node.left, x, y, width / 2, depth + 1);
                }
                if (node.right && !node.right.isNil) {
                    this.calculatePositions(node.right, x + width / 2, y, width / 2, depth + 1);
                }
            }

            renderEdges(node, container) {
                if (node === null) return;
                
                const nodePos = this.nodePositions.get(node.id);
                
                if (node.left && !node.left.isNil) {
                    const leftPos = this.nodePositions.get(node.left.id);
                    this.createEdge(container, nodePos, leftPos);
                    this.renderEdges(node.left, container);
                }
                
                if (node.right && !node.right.isNil) {
                    const rightPos = this.nodePositions.get(node.right.id);
                    this.createEdge(container, nodePos, rightPos);
                    this.renderEdges(node.right, container);
                }
            }

            createEdge(container, from, to) {
                const edge = document.createElement('div');
                edge.className = 'tree-edge';
                
                const dx = to.x - from.x;
                const dy = to.y - from.y;
                const length = Math.sqrt(dx * dx + dy * dy);
                const angle = Math.atan2(dy, dx) * 180 / Math.PI;
                
                edge.style.width = length + 'px';
                edge.style.height = '2px';
                edge.style.left = from.x + 'px';
                edge.style.top = from.y + 'px';
                edge.style.transformOrigin = '0 50%';
                edge.style.transform = `rotate(${angle}deg)`;
                
                container.appendChild(edge);
            }

            renderNodes(node, container, currentNodeId, action) {
                if (node === null) return;
                
                const nodeElement = document.createElement('div');
                nodeElement.className = `tree-node ${node.color}`;
                nodeElement.textContent = node.value;
                
                const pos = this.nodePositions.get(node.id);
                nodeElement.style.left = (pos.x - 20) + 'px';
                nodeElement.style.top = (pos.y - 20) + 'px';
                
                if (node.id === currentNodeId) {
                    if (action === 'violation') {
                        nodeElement.classList.add('violating');
                    } else if (action === 'rotating' || action === 'prepare_rotation' || action === 'final_rotation') {
                        nodeElement.classList.add('rotating');
                    } else if (action === 'found' || action === 'successor_found' || action === 'complete') {
                        nodeElement.classList.add('fixed');
                    } else {
                        nodeElement.classList.add('current');
                    }
                }
                
                container.appendChild(nodeElement);
                
                if (node.left && !node.left.isNil) {
                    this.renderNodes(node.left, container, currentNodeId, action);
                }
                if (node.right && !node.right.isNil) {
                    this.renderNodes(node.right, container, currentNodeId, action);
                }
            }
        }

        // Initialize the visualizer
        const visualizer = new RBTreeVisualizer();
    </script>
