        .edges-table th,

        .edges-table th {

        .edges-table tr.selected {

        }

        .edges-table tr.considering {
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.1), rgba(238, 90, 36, 0.1));
        }

        .edges-table tr.rejected {

        }

        .navigation {
            display: flex;

        }

        .step-info {

        .step-info h3 {

        .step-info p {

        .back-link {

        .back-link:hover { color: #2563eb; }

            @media (max-width: 768px) {

                .visualization-content {

        .pc-recommend {
            background: linear-gradient(135deg, #1e3a5f, #1d4ed8);

        .pc-recommend span { opacity: 0.95; }
        @media (max-width: 768px) {
            body { overflow-x: hidden; }
            .container { padding: 16px; margin: 0 8px; max-width: 100%; }
        }
    </style>

<body>
    <p class="pc-recommend"><span>💻 PC에서 보시면 시각화를 더 편하게 이용할 수 있습니다.</span></p>
    <div class="container">
        <a href="../../index.html" class="back-link">← 메인으로</a>
        <div class="controls">
            <button class="btn-primary" onclick="visualizer.generateGraph()">Start Algorithm</button>
            <button class="btn-secondary" onclick="visualizer.reset()">Reset</button>
        </div>

        <div class="info-panel">
            <div class="info-item">
                <h3>Algorithm</h3>
                <div class="value">Kruskal's Algorithm</div>
            </div>
            <div class="info-item">
                <h3>Step</h3>
                <div class="value" id="stepCounter">0 / 0</div>
            </div>
            <div class="info-item">
                <h3>Time Complexity</h3>
                <div class="value">O(E log E)</div>
            </div>
            <div class="info-item">
                <h3>Space Complexity</h3>
                <div class="value">O(V)</div>
            </div>
        </div>

        <div class="step-info">
            <h3 id="stepTitle">Initialize Graph</h3>
            <p id="stepDescription">Click "Start Algorithm" to begin Kruskal's algorithm visualization.</p>
        </div>

        <div class="visualization">
            <div class="visualization-content">
                <div class="graph-container" id="graphContainer">
                    <!-- Graph will be rendered here -->
                </div>
                
                <div class="edges-table-container">
                    <table class="edges-table" id="edgesTable" style="display: none;">
                        <thead>
                            <tr>
                                <th>Edge</th>
                                <th>Weight</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="edgesTableBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="navigation">
            <button class="btn-secondary" id="prevBtn" onclick="visualizer.previousStep()" disabled="">Previous</button>
            <button class="btn-primary" id="nextBtn" onclick="visualizer.nextStep()" disabled="">Next Step</button>
        </div>
    </div>

    <script>
        class KruskalsVisualizer {
            constructor() {
                this.graph = { nodes: [], edges: [] };
                this.sortedEdges = [];
                this.mst = [];
                this.parent = {};
                this.rank = {};
                this.currentStep = 0;
                this.steps = [];
                this.nodePositions = {};
                
                this.initializeEventListeners();
            }

            initializeEventListeners() {
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowLeft') {
                        this.previousStep();
                    } else if (e.key === 'ArrowRight') {
                        this.nextStep();
                    }
                });
            }

            parseInput(input) {
                const edges = [];
                const nodes = new Set();
                
                const edgeStrings = input.split(',').map(s => s.trim());
                
                for (const edgeString of edgeStrings) {
                    const match = edgeString.match(/^([A-Z]+)-([A-Z]+):(\d+)$/);
                    if (match) {
                        const [, from, to, weight] = match;
                        edges.push({ from, to, weight: parseInt(weight) });
                        nodes.add(from);
                        nodes.add(to);
                    }
                }
                
                return { nodes: Array.from(nodes), edges };
            }

            generateGraph() {
                const input = "A-B:4,B-C:8,C-D:7,D-E:9,E-F:10,F-D:14,F-C:4,D-A:8,A-E:11,C-E:2,B-F:6";
                this.graph = this.parseInput(input);
                
                this.generateNodePositions();
                this.initializeUnionFind();
                this.generateSteps();
                this.currentStep = 0;
                this.renderGraph();
                this.renderEdgesTable();
                this.updateUI();
            }

            generateNodePositions() {
                const container = document.getElementById('graphContainer');
                const containerWidth = container.offsetWidth - 80;
                const containerHeight = container.offsetHeight - 80;
                
                const nodeCount = this.graph.nodes.length;
                const angle = (2 * Math.PI) / nodeCount;
                const radius = Math.min(containerWidth, containerHeight) / 2.5;
                const centerX = containerWidth / 2 + 40;
                const centerY = containerHeight / 2 + 40;
                
                this.nodePositions = {};
                this.graph.nodes.forEach((node, index) => {
                    const x = centerX + radius * Math.cos(index * angle - Math.PI / 2);
                    const y = centerY + radius * Math.sin(index * angle - Math.PI / 2);
                    this.nodePositions[node] = { x, y };
                });
            }

            initializeUnionFind() {
                this.parent = {};
                this.rank = {};
                
                for (const node of this.graph.nodes) {
                    this.parent[node] = node;
                    this.rank[node] = 0;
                }
            }

            find(x) {
                if (this.parent[x] !== x) {
                    this.parent[x] = this.find(this.parent[x]);
                }
                return this.parent[x];
            }

            union(x, y) {
                const rootX = this.find(x);
                const rootY = this.find(y);
                
                if (rootX !== rootY) {
                    if (this.rank[rootX] < this.rank[rootY]) {
                        this.parent[rootX] = rootY;
                    } else if (this.rank[rootX] > this.rank[rootY]) {
                        this.parent[rootY] = rootX;
                    } else {
                        this.parent[rootY] = rootX;
                        this.rank[rootX]++;
                    }
                    return true;
                }
                return false;
            }

            generateSteps() {
                this.steps = [];
                this.sortedEdges = [...this.graph.edges].sort((a, b) => a.weight - b.weight);
                this.mst = [];
                
                // Initialize step
                this.steps.push({
                    type: 'init',
                    title: 'Initialize Algorithm',
                    description: 'Sort all edges by weight in ascending order. Initialize Union-Find data structure.',
                    sortedEdges: [...this.sortedEdges],
                    mst: [],
                    consideringEdge: null,
                    rejectedEdges: []
                });

                // Process each edge
                this.initializeUnionFind();
                const rejectedEdges = [];
                
                for (let i = 0; i < this.sortedEdges.length; i++) {
                    const edge = this.sortedEdges[i];
                    
                    // Step: Consider edge
                    this.steps.push({
                        type: 'consider',
                        title: `Consider Edge ${edge.from}-${edge.to}`,
                        description: `Examining edge ${edge.from}-${edge.to} with weight ${edge.weight}. Check if it creates a cycle.`,
                        sortedEdges: [...this.sortedEdges],
                        mst: [...this.mst],
                        consideringEdge: edge,
                        rejectedEdges: [...rejectedEdges]
                    });

                    // Check if edge creates cycle
                    if (this.find(edge.from) !== this.find(edge.to)) {
                        // Accept edge
                        this.union(edge.from, edge.to);
                        this.mst.push(edge);
                        
                        this.steps.push({
                            type: 'accept',
                            title: `Accept Edge ${edge.from}-${edge.to}`,
                            description: `Edge ${edge.from}-${edge.to} does not create a cycle. Add it to MST.`,
                            sortedEdges: [...this.sortedEdges],
                            mst: [...this.mst],
                            consideringEdge: null,
                            rejectedEdges: [...rejectedEdges]
                        });
                    } else {
                        // Reject edge
                        rejectedEdges.push(edge);
                        
                        this.steps.push({
                            type: 'reject',
                            title: `Reject Edge ${edge.from}-${edge.to}`,
                            description: `Edge ${edge.from}-${edge.to} creates a cycle. Reject it.`,
                            sortedEdges: [...this.sortedEdges],
                            mst: [...this.mst],
                            consideringEdge: null,
                            rejectedEdges: [...rejectedEdges]
                        });
                    }
                }

                // Final step
                this.steps.push({
                    type: 'complete',
                    title: 'Algorithm Complete',
                    description: `Minimum Spanning Tree constructed with ${this.mst.length} edges and total weight ${this.mst.reduce((sum, edge) => sum + edge.weight, 0)}.`,
                    sortedEdges: [...this.sortedEdges],
                    mst: [...this.mst],
                    consideringEdge: null,
                    rejectedEdges: [...rejectedEdges]
                });
            }

            renderGraph() {
                const container = document.getElementById('graphContainer');
                container.innerHTML = '';
                
                // Render edges
                this.graph.edges.forEach(edge => {
                    this.renderEdge(edge);
                });
                
                // Render nodes
                this.graph.nodes.forEach(node => {
                    this.renderNode(node);
                });
            }

            renderNode(node) {
                const container = document.getElementById('graphContainer');
                const nodeElement = document.createElement('div');
                nodeElement.className = 'node';
                nodeElement.textContent = node;
                
                const pos = this.nodePositions[node];
                nodeElement.style.left = (pos.x - 20) + 'px';
                nodeElement.style.top = (pos.y - 20) + 'px';
                
                container.appendChild(nodeElement);
            }

            renderEdge(edge) {
                const container = document.getElementById('graphContainer');
                const pos1 = this.nodePositions[edge.from];
                const pos2 = this.nodePositions[edge.to];
                
                const dx = pos2.x - pos1.x;
                const dy = pos2.y - pos1.y;
                const length = Math.sqrt(dx * dx + dy * dy);
                const angle = Math.atan2(dy, dx);
                
                const edgeElement = document.createElement('div');
                edgeElement.className = 'edge';
                edgeElement.style.left = pos1.x + 'px';
                edgeElement.style.top = (pos1.y - 1.5) + 'px';
                edgeElement.style.width = length + 'px';
                edgeElement.style.transform = `rotate(${angle}rad)`;
                edgeElement.dataset.from = edge.from;
                edgeElement.dataset.to = edge.to;
                edgeElement.dataset.weight = edge.weight;
                
                const weightElement = document.createElement('div');
                weightElement.className = 'edge-weight';
                weightElement.textContent = edge.weight;
                weightElement.style.left = (pos1.x + pos2.x) / 2 + 'px';
                weightElement.style.top = (pos1.y + pos2.y) / 2 + 'px';
                weightElement.dataset.from = edge.from;
                weightElement.dataset.to = edge.to;
                
                container.appendChild(edgeElement);
                container.appendChild(weightElement);
            }

            renderEdgesTable() {
                const tableBody = document.getElementById('edgesTableBody');
                const table = document.getElementById('edgesTable');
                
                tableBody.innerHTML = '';
                
                this.sortedEdges.forEach(edge => {
                    const row = document.createElement('tr');
                    row.dataset.from = edge.from;
                    row.dataset.to = edge.to;
                    
                    row.innerHTML = `
                        <td>${edge.from}-${edge.to}</td>
                        <td>${edge.weight}</td>
                        <td id="status-${edge.from}-${edge.to}">Pending</td>
                    `;
                    
                    tableBody.appendChild(row);
                });
                
                table.style.display = 'table';
            }

            updateVisualization() {
                const step = this.steps[this.currentStep];
                if (!step) return;
                
                // Update edges
                const edges = document.querySelectorAll('.edge');
                const weights = document.querySelectorAll('.edge-weight');
                const rows = document.querySelectorAll('#edgesTableBody tr');
                
                edges.forEach(edge => {
                    const from = edge.dataset.from;
                    const to = edge.dataset.to;
                    const weight = parseInt(edge.dataset.weight);
                    
                    edge.className = 'edge';
                    
                    // Check if edge is in MST
                    const inMST = step.mst.some(mstEdge => 
                        (mstEdge.from === from && mstEdge.to === to) ||
                        (mstEdge.from === to && mstEdge.to === from)
                    );
                    
                    // Check if edge is being considered
                    const isConsidering = step.consideringEdge && 
                        ((step.consideringEdge.from === from && step.consideringEdge.to === to) ||
                         (step.consideringEdge.from === to && step.consideringEdge.to === from));
                    
                    // Check if edge is rejected
                    const isRejected = step.rejectedEdges.some(rejEdge => 
                        (rejEdge.from === from && rejEdge.to === to) ||
                        (rejEdge.from === to && rejEdge.to === from)
                    );
                    
                    if (inMST) {
                        edge.classList.add('selected');
                    } else if (isConsidering) {
                        edge.classList.add('considering');
                    } else if (isRejected) {
                        edge.classList.add('rejected');
                    }
                });
                
                // Update edge weights
                weights.forEach(weight => {
                    const from = weight.dataset.from;
                    const to = weight.dataset.to;
                    
                    weight.className = 'edge-weight';
                    
                    const inMST = step.mst.some(mstEdge => 
                        (mstEdge.from === from && mstEdge.to === to) ||
                        (mstEdge.from === to && mstEdge.to === from)
                    );
                    
                    const isConsidering = step.consideringEdge && 
                        ((step.consideringEdge.from === from && step.consideringEdge.to === to) ||
                         (step.consideringEdge.from === to && step.consideringEdge.to === from));
                    
                    if (inMST) {
                        weight.classList.add('selected');
                    } else if (isConsidering) {
                        weight.classList.add('considering');
                    }
                });
                
                // Update table rows
                rows.forEach(row => {
                    const from = row.dataset.from;
                    const to = row.dataset.to;
                    const statusCell = document.getElementById(`status-${from}-${to}`);
                    
                    row.className = '';
                    
                    const inMST = step.mst.some(mstEdge => 
                        (mstEdge.from === from && mstEdge.to === to) ||
                        (mstEdge.from === to && mstEdge.to === from)
                    );
                    
                    const isConsidering = step.consideringEdge && 
                        ((step.consideringEdge.from === from && step.consideringEdge.to === to) ||
                         (step.consideringEdge.from === to && step.consideringEdge.to === from));
                    
                    const isRejected = step.rejectedEdges.some(rejEdge => 
                        (rejEdge.from === from && rejEdge.to === to) ||
                        (rejEdge.from === to && rejEdge.to === from)
                    );
                    
                    if (inMST) {
                        row.classList.add('selected');
                        statusCell.textContent = 'In MST';
                    } else if (isConsidering) {
                        row.classList.add('considering');
                        statusCell.textContent = 'Considering';
                    } else if (isRejected) {
                        row.classList.add('rejected');
                        statusCell.textContent = 'Rejected';
                    } else {
                        statusCell.textContent = 'Pending';
                    }
                });
            }

            updateUI() {
                const step = this.steps[this.currentStep];
                if (!step) return;
                
                document.getElementById('stepCounter').textContent = `${this.currentStep + 1} / ${this.steps.length}`;
                document.getElementById('stepTitle').textContent = step.title;
                document.getElementById('stepDescription').textContent = step.description;
                
                document.getElementById('prevBtn').disabled = this.currentStep === 0;
                document.getElementById('nextBtn').disabled = this.currentStep === this.steps.length - 1;
                
                this.updateVisualization();
            }

            nextStep() {
                if (this.currentStep < this.steps.length - 1) {
                    this.currentStep++;
                    this.updateUI();
                }
            }

            previousStep() {
                if (this.currentStep > 0) {
                    this.currentStep--;
                    this.updateUI();
                }
            }

            reset() {
                this.currentStep = 0;
                this.steps = [];
                this.mst = [];
                document.getElementById('graphContainer').innerHTML = '';
                document.getElementById('edgesTable').style.display = 'none';
                document.getElementById('stepCounter').textContent = '0 / 0';
                document.getElementById('stepTitle').textContent = 'Initialize Graph';
