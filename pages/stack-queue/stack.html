<!DOCTYPE html>
<!-- saved from url=(0053)https://codes.yalco.kr/ds-algorithm/linear/stack.html -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스택 시각화 | 자료구조 시각화</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8f9fa;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            border: 1px solid #e9ecef;
        }

        .control-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
            align-items: end;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-size: 14px;
            font-weight: 600;
            color: #555;
        }

        input[type="text"], select {
            padding: 12px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            min-width: 200px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #1d4ed8;
            box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.1);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(29, 78, 216, 0.3);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #495057;
            border: 2px solid #dee2e6;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #e9ecef;
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .info-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 15px;
        }

        .info-item {
            text-align: center;
            padding: 15px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .info-item h3 {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            margin-bottom: 5px;
        }

        .info-item p {
            font-size: 18px;
            font-weight: 700;
            color: #333;
        }

        .visualization {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            min-height: 400px;
            display: flex;
            align-items: end;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .stack-container {
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            gap: 2px;
            min-height: 300px;
            justify-content: flex-start;
            position: relative;
            margin-left: 100px;
        }

        .stack-element {
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            min-width: 120px;
            text-align: center;
            transition: all 0.5s ease;
            box-shadow: 0 4px 15px rgba(29, 78, 216, 0.3);
            position: relative;
        }

        .stack-element.pushing {
            background: linear-gradient(135deg, #feca57, #ff9ff3);
            transform: scale(1.1) translateY(-10px);
            box-shadow: 0 8px 25px rgba(254, 202, 87, 0.4);
        }

        .stack-element.popping {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            transform: scale(1.1) translateY(-20px);
            opacity: 0.7;
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.4);
        }

        .stack-pointer {
            position: absolute;
            left: -90px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            color: #1d4ed8;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .stack-pointer::after {
            content: '→';
            font-size: 24px;
            margin-left: 5px;
        }

        .stack-base {
            width: 160px;
            height: 4px;
            background: #dee2e6;
            border-radius: 2px;
            margin-bottom: 10px;
        }

        .step-description {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #1d4ed8;
        }

        .step-description h3 {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .step-description p {
            font-size: 16px;
            color: #666;
            line-height: 1.5;
        }

        .navigation {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .empty-stack {
            color: #999;
            font-size: 16px;
            font-style: italic;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 2px dashed #dee2e6;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            color: #1d4ed8;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
        .back-link:hover { color: #2563eb; }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            .control-panel {
                flex-direction: column;
                align-items: stretch;
            }
            
            .input-group {
                width: 100%;
            }
            
            input[type="text"], select {
                min-width: auto;
            }
            
            .info-panel {
                grid-template-columns: 1fr;
            }
            
            .stack-container {
                margin-left: 0;
            }
            
            .stack-pointer {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../../index.html" class="back-link">← 메인으로</a>
        <div class="control-panel">
            <div class="input-group">
                <label for="operation">연산</label>
                <select id="operation">
                    <option value="push">Push (삽입)</option>
                    <option value="pop">Pop (삭제)</option>
                    <option value="peek">Peek (확인)</option>
                </select>
            </div>
            <div class="input-group">
                <label for="value">값</label>
                <input type="text" id="value" placeholder="Push할 값 입력">
            </div>
            <button class="btn btn-primary" id="executeBtn">실행</button>
            <button class="btn btn-secondary" id="resetBtn">초기화</button>
        </div>

        <div class="info-panel">
            <div class="info-item">
                <h3>자료구조</h3>
                <p>스택 (LIFO)</p>
            </div>
            <div class="info-item">
                <h3>단계</h3>
                <p id="stepInfo">대기</p>
            </div>
            <div class="info-item">
                <h3>시간 복잡도</h3>
                <p id="timeComplexity">O(1)</p>
            </div>
            <div class="info-item">
                <h3>공간 복잡도</h3>
                <p>O(n)</p>
            </div>
            <div class="info-item">
                <h3>크기</h3>
                <p id="stackSize">0</p>
            </div>
        </div>

        <div class="visualization">
            <div class="stack-container" id="stackContainer">
                <div class="stack-base"></div>
                <div class="empty-stack" id="emptyStack">스택이 비어 있습니다</div>
            </div>
        </div>

        <div class="step-description">
            <h3 id="stepTitle">스택 연산</h3>
            <p id="stepText">연산을 선택한 뒤 실행하세요. Push는 맨 위에 추가, Pop은 맨 위 제거, Peek은 맨 위 값 확인입니다.</p>
        </div>

        <div class="navigation">
            <button class="btn btn-secondary" id="prevBtn" disabled="">이전 단계</button>
            <button class="btn btn-secondary" id="nextBtn" disabled="">다음 단계</button>
        </div>
    </div>

    <script>
        class StackVisualizer {
            constructor() {
                this.stack = [];
                this.currentStep = 0;
                this.steps = [];
                this.isAnimating = false;
                
                this.initializeEventListeners();
                this.updateUI();
            }

            initializeEventListeners() {
                document.getElementById('executeBtn').addEventListener('click', () => this.executeOperation());
                document.getElementById('resetBtn').addEventListener('click', () => this.reset());
                document.getElementById('prevBtn').addEventListener('click', () => this.previousStep());
                document.getElementById('nextBtn').addEventListener('click', () => this.nextStep());
                
                document.getElementById('operation').addEventListener('change', () => this.updateOperationUI());
                document.getElementById('value').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.executeOperation();
                });

                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    if (e.target.tagName.toLowerCase() === 'input') return;
                    
                    switch(e.key) {
                        case 'ArrowLeft':
                            e.preventDefault();
                            this.previousStep();
                            break;
                        case 'ArrowRight':
                            e.preventDefault();
                            this.nextStep();
                            break;
                        case 'Enter':
                            e.preventDefault();
                            this.executeOperation();
                            break;
                        case 'r':
                        case 'R':
                            if (e.ctrlKey || e.metaKey) return;
                            e.preventDefault();
                            this.reset();
                            break;
                    }
                });
            }

            updateOperationUI() {
                const operation = document.getElementById('operation').value;
                const valueInput = document.getElementById('value');
                
                if (operation === 'push') {
                    valueInput.disabled = false;
                    valueInput.placeholder = 'Push할 값 입력';
                } else {
                    valueInput.disabled = true;
                    valueInput.placeholder = `${operation}에는 입력 불필요`;
                }
            }

            executeOperation() {
                if (this.isAnimating) return;

                const operation = document.getElementById('operation').value;
                const value = document.getElementById('value').value.trim();

                if (operation === 'push' && !value) {
                    alert('Please enter a value to push');
                    return;
                }

                this.steps = [];
                this.currentStep = 0;

                switch(operation) {
                    case 'push':
                        this.executePush(value);
                        break;
                    case 'pop':
                        this.executePop();
                        break;
                    case 'peek':
                        this.executePeek();
                        break;
                }

                document.getElementById('value').value = '';
                this.updateNavigationButtons();
            }

            executePush(value) {
                this.steps = [
                    {
                        title: "Push 연산",
                        description: `"${value}"을(를) 스택 맨 위에 추가합니다`,
                        action: () => {
                            this.stack.push(value);
                            this.renderStack();
                            this.animateLastElement('pushing');
                        }
                    }
                ];
                this.executeStep();
            }

            executePop() {
                if (this.stack.length === 0) {
                    this.steps = [
                        {
                            title: "Pop 연산 - 스택 비어 있음",
                            description: "빈 스택에서는 Pop할 수 없습니다 (스택 언더플로우)",
                            action: () => {}
                        }
                    ];
                } else {
                    const poppedValue = this.stack[this.stack.length - 1];
                    this.steps = [
                        {
                            title: "Pop 연산",
                            description: `맨 위의 "${poppedValue}"을(를) 제거합니다`,
                            action: () => {
                                this.animateLastElement('popping');
                                setTimeout(() => {
                                    this.stack.pop();
                                    this.renderStack();
                                }, 300);
                            }
                        }
                    ];
                }
                this.executeStep();
            }

            executePeek() {
                if (this.stack.length === 0) {
                    this.steps = [
                        {
                            title: "Peek 연산 - 스택 비어 있음",
                            description: "빈 스택에서는 Peek할 수 없습니다",
                            action: () => {}
                        }
                    ];
                } else {
                    const topValue = this.stack[this.stack.length - 1];
                    this.steps = [
                        {
                            title: "Peek 연산",
                            description: `맨 위 요소: "${topValue}" (스택에 그대로 유지됨)`,
                            action: () => {
                                this.animateLastElement('pushing');
                            }
                        }
                    ];
                }
                this.executeStep();
            }

            executeStep() {
                if (this.currentStep < this.steps.length) {
                    const step = this.steps[this.currentStep];
                    document.getElementById('stepTitle').textContent = step.title;
                    document.getElementById('stepText').textContent = step.description;
                    document.getElementById('stepInfo').textContent = `${this.currentStep + 1} / ${this.steps.length}`;
                    
                    this.isAnimating = true;
                    step.action();
                    
                    setTimeout(() => {
                        this.isAnimating = false;
                        this.updateUI();
                    }, 600);
                }
            }

            previousStep() {
                if (this.currentStep > 0) {
                    this.currentStep--;
                    this.executeStep();
                }
            }

            nextStep() {
                if (this.currentStep < this.steps.length - 1) {
                    this.currentStep++;
                    this.executeStep();
                }
            }

            animateLastElement(animationType) {
                const elements = document.querySelectorAll('.stack-element');
                if (elements.length > 0) {
                    const lastElement = elements[elements.length - 1];
                    lastElement.classList.add(animationType);
                    
                    setTimeout(() => {
                        lastElement.classList.remove(animationType);
                    }, 500);
                }
            }

            renderStack() {
                const container = document.getElementById('stackContainer');
                const emptyStack = document.getElementById('emptyStack');
                
                // Remove existing elements except base and empty message
                const existingElements = container.querySelectorAll('.stack-element');
                existingElements.forEach(el => el.remove());
                
                if (this.stack.length === 0) {
                    emptyStack.style.display = 'block';
                } else {
                    emptyStack.style.display = 'none';
                    
                    this.stack.forEach((value, index) => {
                        const element = document.createElement('div');
                        element.className = 'stack-element';
                        element.textContent = value;
                        
                        if (index === this.stack.length - 1) {
                            const pointer = document.createElement('div');
                            pointer.className = 'stack-pointer';
                            pointer.textContent = '맨 위';
                            element.appendChild(pointer);
                        }
                        
                        container.appendChild(element);
                    });
                }
            }

            updateNavigationButtons() {
                const prevBtn = document.getElementById('prevBtn');
                const nextBtn = document.getElementById('nextBtn');
                
                prevBtn.disabled = this.currentStep <= 0 || this.steps.length === 0;
                nextBtn.disabled = this.currentStep >= this.steps.length - 1 || this.steps.length === 0;
            }

            updateUI() {
                document.getElementById('stackSize').textContent = this.stack.length;
                this.updateNavigationButtons();
                this.updateOperationUI();
                
                if (this.steps.length === 0) {
                    document.getElementById('stepInfo').textContent = '대기';
                    document.getElementById('stepTitle').textContent = '스택 연산';
                    document.getElementById('stepText').textContent = '연산을 선택한 뒤 실행하세요. Push는 맨 위에 추가, Pop은 맨 위 제거, Peek은 맨 위 값 확인입니다.';
                }
            }

            reset() {
                this.stack = [];
                this.steps = [];
                this.currentStep = 0;
                this.isAnimating = false;
                
                this.renderStack();
                this.updateUI();
                
                document.getElementById('value').value = '';
            }
        }

        // Initialize the visualizer when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            new StackVisualizer();
        });
    </script>


</body></html>
