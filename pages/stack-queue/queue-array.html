<!DOCTYPE html>

<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>큐 비교 (선형/원형) 시각화 | 자료구조 시각화</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8f9fa;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            border: 1px solid #e9ecef;
        }

        .control-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
            align-items: end;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-size: 14px;
            font-weight: 600;
            color: #555;
        }

        input[type="text"], input[type="number"], select {
            padding: 12px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            min-width: 200px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #1d4ed8;
            box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.1);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(29, 78, 216, 0.3);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #495057;
            border: 2px solid #dee2e6;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #e9ecef;
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .info-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 15px;
        }

        .info-item {
            text-align: center;
            padding: 15px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .info-item h3 {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            margin-bottom: 5px;
        }

        .info-item .value {
            font-size: 18px;
            font-weight: 700;
            color: #333;
        }

        .queues-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .queue-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid #e9ecef;
        }

        .queue-title {
            font-size: 18px;
            font-weight: 700;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        .queue-visualization {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            margin-bottom: 15px;
        }

        .linear-queue {
            display: flex;
            gap: 2px;
        }

        .circular-queue {
            display: flex;
            gap: 2px;
        }

        .queue-element {
            width: 40px;
            height: 40px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            transition: all 0.5s ease;
            background: white;
        }

        .queue-element.filled {
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            color: white;
            border-color: #1d4ed8;
        }

        .queue-element.front {
            background: linear-gradient(135deg, #26de81, #20bf6b);
            color: white;
            border-color: #26de81;
            transform: scale(1.1);
        }

        .queue-element.rear {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            border-color: #ff6b6b;
            transform: scale(1.1);
        }

        .queue-element.active {
            background: linear-gradient(135deg, #feca57, #ff9ff3);
            color: white;
            border-color: #feca57;
            transform: scale(1.15);
        }

        .circular .queue-element {
            border-radius: 8px;
        }

        .queue-info {
            display: flex;
            justify-content: space-around;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
        }

        .queue-info span {
            color: #666;
        }

        .step-description {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        .step-description p {
            font-size: 16px;
            color: #333;
            line-height: 1.5;
        }

        .navigation-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            align-items: center;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
            color: #666;
        }

        .input-group.dequeue-hidden {
            display: none;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            color: #1d4ed8;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
        .back-link:hover { color: #2563eb; }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            border: 1px solid #e1e8ed;
        }
            
            .control-panel {
                flex-direction: column;
                align-items: stretch;
            }
            
            .input-group input, .input-group select {
                min-width: auto;
            }
            
            .queues-container {
                grid-template-columns: 1fr;
            }
            
            .navigation-controls {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../../index.html" class="back-link">← 메인으로</a>
        <div class="control-panel">
            <div class="input-group">
                <label for="queueSize">큐 크기</label>
                <input type="number" id="queueSize" value="8" min="4" max="12">
            </div>
            <div class="input-group">
                <label for="operation">연산</label>
                <select id="operation">
                    <option value="enqueue">Enqueue (삽입)</option>
                    <option value="dequeue">Dequeue (삭제)</option>
                </select>
            </div>
            <div class="input-group" id="valueGroup">
                <label for="value">값</label>
                <input type="text" id="value" placeholder="값 입력">
            </div>
            <button class="btn btn-primary" id="executeBtn">연산 실행</button>
            <button class="btn btn-secondary" id="resetBtn">초기화</button>
        </div>

        <div class="info-panel">
            <div class="info-item">
                <h3>개념</h3>
                <div class="value">큐 비교 (선형 vs 원형)</div>
            </div>
            <div class="info-item">
                <h3>단계</h3>
                <div class="value" id="stepInfo">1 / 1</div>
            </div>
            <div class="info-item">
                <h3>시간 복잡도</h3>
                <div class="value">O(1)</div>
            </div>
            <div class="info-item">
                <h3>공간 복잡도</h3>
                <div class="value">O(n)</div>
            </div>
        </div>

        <div class="queues-container">
            <div class="queue-section">
                <div class="queue-title">선형 큐</div>
                <div class="queue-visualization">
                    <div class="linear-queue" id="linearQueue"><div class="queue-element" id="linear-0"></div><div class="queue-element" id="linear-1"></div><div class="queue-element" id="linear-2"></div><div class="queue-element" id="linear-3"></div><div class="queue-element" id="linear-4"></div><div class="queue-element" id="linear-5"></div><div class="queue-element" id="linear-6"></div><div class="queue-element" id="linear-7"></div></div>
                </div>
                <div class="queue-info">
                    <span>앞(Front): <span id="linearFront">-1</span></span>
                    <span>뒤(Rear): <span id="linearRear">-1</span></span>
                    <span>크기: <span id="linearSize">0</span></span>
                </div>
            </div>

            <div class="queue-section">
                <div class="queue-title">원형 큐</div>
                <div class="queue-visualization">
                    <div class="circular-queue" id="circularQueue"><div class="queue-element circular" id="circular-0"></div><div class="queue-element circular" id="circular-1"></div><div class="queue-element circular" id="circular-2"></div><div class="queue-element circular" id="circular-3"></div><div class="queue-element circular" id="circular-4"></div><div class="queue-element circular" id="circular-5"></div><div class="queue-element circular" id="circular-6"></div><div class="queue-element circular" id="circular-7"></div></div>
                </div>
                <div class="queue-info">
                    <span>앞(Front): <span id="circularFront">-1</span></span>
                    <span>뒤(Rear): <span id="circularRear">-1</span></span>
                    <span>크기: <span id="circularSize">0</span></span>
                </div>
            </div>
        </div>

        <div class="step-description">
            <p id="stepDescription">두 큐를 초기화했습니다. 선형 큐는 앞 위치 고정, 원형 큐는 링 형태로 회전합니다.</p>
        </div>

        <div class="navigation-controls">
            <button class="btn btn-secondary" id="prevBtn" disabled="">이전</button>
            <button class="btn btn-secondary" id="nextBtn" disabled="">다음</button>
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-color" style="background: white; border: 2px solid #e1e8ed;"></div>
                <span>비어 있음</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: linear-gradient(135deg, #1d4ed8, #2563eb);"></div>
                <span>채워짐</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: linear-gradient(135deg, #26de81, #20bf6b);"></div>
                <span>앞(Front)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: linear-gradient(135deg, #ff6b6b, #ee5a24);"></div>
                <span>뒤(Rear)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: linear-gradient(135deg, #feca57, #ff9ff3);"></div>
                <span>연산 대상</span>
            </div>
        </div>
    </div>

    <script>
        class QueueComparison {
            constructor() {
                this.queueSize = 8;
                this.steps = [];
                this.currentStep = 0;
                this.linearQueue = new Array(this.queueSize).fill(null);
                this.circularQueue = new Array(this.queueSize).fill(null);
                this.linearFront = -1;
                this.linearRear = -1;
                this.circularFront = -1;
                this.circularRear = -1;
                this.linearSize = 0;
                this.circularSize = 0;
                
                this.initializeEventListeners();
                this.initializeQueues();
                this.toggleValueInput();
                this.updateUI();
            }

            initializeEventListeners() {
                document.getElementById('queueSize').addEventListener('change', () => this.changeQueueSize());
                document.getElementById('operation').addEventListener('change', () => this.toggleValueInput());
                document.getElementById('executeBtn').addEventListener('click', () => this.executeOperation());
                document.getElementById('resetBtn').addEventListener('click', () => this.reset());
                document.getElementById('prevBtn').addEventListener('click', () => this.previousStep());
                document.getElementById('nextBtn').addEventListener('click', () => this.nextStep());
                
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowLeft') this.previousStep();
                    if (e.key === 'ArrowRight') this.nextStep();
                    if (e.key === 'Enter') this.executeOperation();
                });

                document.getElementById('value').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.executeOperation();
                });
            }

            changeQueueSize() {
                this.queueSize = parseInt(document.getElementById('queueSize').value);
                this.reset();
            }

            toggleValueInput() {
                const operation = document.getElementById('operation').value;
                const valueGroup = document.getElementById('valueGroup');
                
                if (operation === 'dequeue') {
                    valueGroup.classList.add('dequeue-hidden');
                } else {
                    valueGroup.classList.remove('dequeue-hidden');
                }
            }

            initializeQueues() {
                this.createLinearQueue();
                this.createCircularQueue();
            }

            createLinearQueue() {
                const container = document.getElementById('linearQueue');
                container.innerHTML = '';
                
                for (let i = 0; i < this.queueSize; i++) {
                    const element = document.createElement('div');
                    element.className = 'queue-element';
                    element.id = `linear-${i}`;
                    element.textContent = '';
                    container.appendChild(element);
                }
            }

            createCircularQueue() {
                const container = document.getElementById('circularQueue');
                container.innerHTML = '';
                
                for (let i = 0; i < this.queueSize; i++) {
                    const element = document.createElement('div');
                    element.className = 'queue-element circular';
                    element.id = `circular-${i}`;
                    element.textContent = '';
                    container.appendChild(element);
                }
            }

            executeOperation() {
                const operation = document.getElementById('operation').value;
                const value = document.getElementById('value').value.trim();
                
                if (operation === 'enqueue') {
                    if (!value) {
                        return;
                    }
                    this.enqueue(value);
                } else {
                    this.dequeue();
                }
                
                document.getElementById('value').value = '';
            }

            enqueue(value) {
                const steps = [];
                
                // Linear Queue Enqueue
                let linearSuccess = false;
                let linearMessage = '';
                
                if (this.linearSize === this.queueSize) {
                    linearMessage = `Linear queue is full. Cannot enqueue "${value}".`;
                } else {
                    if (this.linearFront === -1) {
                        this.linearFront = 0;
                        this.linearRear = 0;
                    } else {
                        this.linearRear++;
                    }
                    this.linearQueue[this.linearRear] = value;
                    this.linearSize++;
                    linearSuccess = true;
                    linearMessage = `선형 큐 위치 ${this.linearRear}에 "${value}" Enqueue됨.`;
                }
                
                // Circular Queue Enqueue
                let circularSuccess = false;
                let circularMessage = '';
                
                if (this.circularSize === this.queueSize) {
                    circularMessage = `Circular queue is full. Cannot enqueue "${value}".`;
                } else {
                    if (this.circularFront === -1) {
                        this.circularFront = 0;
                        this.circularRear = 0;
                    } else {
                        this.circularRear = (this.circularRear + 1) % this.queueSize;
                    }
                    this.circularQueue[this.circularRear] = value;
                    this.circularSize++;
                    circularSuccess = true;
                    circularMessage = `원형 큐 위치 ${this.circularRear}에 "${value}" Enqueue됨.`;
                }
                
                steps.push({
                    description: `${linearMessage} ${circularMessage}`,
                    linearQueue: [...this.linearQueue],
                    circularQueue: [...this.circularQueue],
                    linearFront: this.linearFront,
                    linearRear: this.linearRear,
                    circularFront: this.circularFront,
                    circularRear: this.circularRear,
                    linearSize: this.linearSize,
                    circularSize: this.circularSize,
                    operation: 'enqueue',
                    value: value,
                    linearSuccess,
                    circularSuccess
                });
                
                this.steps.push(...steps);
                this.currentStep = this.steps.length - 1;
                this.updateUI();
            }

            dequeue() {
                const steps = [];
                
                // Linear Queue Dequeue
                let linearValue = null;
                let linearMessage = '';
                
                if (this.linearSize === 0) {
                    linearMessage = 'Linear queue is empty. Cannot dequeue.';
                } else {
                    linearValue = this.linearQueue[this.linearFront];
                    this.linearQueue[this.linearFront] = null;
                    
                    if (this.linearSize === 1) {
                        this.linearFront = -1;
                        this.linearRear = -1;
                    } else {
                        this.linearFront++;
                    }
                    this.linearSize--;
                    linearMessage = `선형 큐에서 "${linearValue}" Dequeue됨.`;
                }
                
                // Circular Queue Dequeue
                let circularValue = null;
                let circularMessage = '';
                
                if (this.circularSize === 0) {
                    circularMessage = 'Circular queue is empty. Cannot dequeue.';
                } else {
                    circularValue = this.circularQueue[this.circularFront];
                    this.circularQueue[this.circularFront] = null;
                    
                    if (this.circularSize === 1) {
                        this.circularFront = -1;
                        this.circularRear = -1;
                    } else {
                        this.circularFront = (this.circularFront + 1) % this.queueSize;
                    }
                    this.circularSize--;
                    circularMessage = `원형 큐에서 "${circularValue}" Dequeue됨.`;
                }
                
                steps.push({
                    description: `${linearMessage} ${circularMessage}`,
                    linearQueue: [...this.linearQueue],
                    circularQueue: [...this.circularQueue],
                    linearFront: this.linearFront,
                    linearRear: this.linearRear,
                    circularFront: this.circularFront,
                    circularRear: this.circularRear,
                    linearSize: this.linearSize,
                    circularSize: this.circularSize,
                    operation: 'dequeue',
                    linearValue,
                    circularValue
                });
                
                this.steps.push(...steps);
                this.currentStep = this.steps.length - 1;
                this.updateUI();
            }

            previousStep() {
                if (this.currentStep > 0) {
                    this.currentStep--;
                    this.updateUI();
                }
            }

            nextStep() {
                if (this.currentStep < this.steps.length - 1) {
                    this.currentStep++;
                    this.updateUI();
                }
            }

            updateUI() {
                this.updateStepInfo();
                this.updateQueueVisualizations();
                this.updateNavigationButtons();
                this.updateQueueInfo();
            }

            updateStepInfo() {
                const stepInfo = document.getElementById('stepInfo');
                const stepDescription = document.getElementById('stepDescription');
                
                if (this.steps.length === 0) {
                    stepInfo.textContent = '1 / 1';
                    stepDescription.textContent = '두 큐를 초기화했습니다. 선형 큐는 앞 위치 고정, 원형 큐는 링 형태로 회전합니다.';
                } else {
                    stepInfo.textContent = `${this.currentStep + 1} / ${this.steps.length}`;
                    stepDescription.textContent = this.steps[this.currentStep].description;
                }
            }

            updateQueueVisualizations() {
                if (this.steps.length === 0) {
                    this.updateLinearVisualization(this.linearQueue, this.linearFront, this.linearRear);
                    this.updateCircularVisualization(this.circularQueue, this.circularFront, this.circularRear);
                } else {
                    const step = this.steps[this.currentStep];
                    this.updateLinearVisualization(step.linearQueue, step.linearFront, step.linearRear);
                    this.updateCircularVisualization(step.circularQueue, step.circularFront, step.circularRear);
                }
            }

            updateLinearVisualization(queue, front, rear) {
                for (let i = 0; i < this.queueSize; i++) {
                    const element = document.getElementById(`linear-${i}`);
                    element.textContent = queue[i] || '';
                    element.className = 'queue-element';
                    
                    if (queue[i] !== null) {
                        element.classList.add('filled');
                    }
                    if (i === front && front !== -1) {
                        element.classList.add('front');
                    }
                    if (i === rear && rear !== -1) {
                        element.classList.add('rear');
                    }
                }
            }

            updateCircularVisualization(queue, front, rear) {
                for (let i = 0; i < this.queueSize; i++) {
                    const element = document.getElementById(`circular-${i}`);
                    element.textContent = queue[i] || '';
                    element.className = 'queue-element circular';
                    
                    if (queue[i] !== null) {
                        element.classList.add('filled');
                    }
                    if (i === front && front !== -1) {
                        element.classList.add('front');
                    }
                    if (i === rear && rear !== -1) {
                        element.classList.add('rear');
                    }
                }
            }

            updateNavigationButtons() {
                const prevBtn = document.getElementById('prevBtn');
                const nextBtn = document.getElementById('nextBtn');
                
                prevBtn.disabled = this.currentStep <= 0;
                nextBtn.disabled = this.currentStep >= this.steps.length - 1;
            }

            updateQueueInfo() {
                if (this.steps.length === 0) {
                    document.getElementById('linearFront').textContent = this.linearFront;
                    document.getElementById('linearRear').textContent = this.linearRear;
                    document.getElementById('linearSize').textContent = this.linearSize;
                    document.getElementById('circularFront').textContent = this.circularFront;
                    document.getElementById('circularRear').textContent = this.circularRear;
                    document.getElementById('circularSize').textContent = this.circularSize;
                } else {
                    const step = this.steps[this.currentStep];
                    document.getElementById('linearFront').textContent = step.linearFront;
                    document.getElementById('linearRear').textContent = step.linearRear;
                    document.getElementById('linearSize').textContent = step.linearSize;
                    document.getElementById('circularFront').textContent = step.circularFront;
                    document.getElementById('circularRear').textContent = step.circularRear;
                    document.getElementById('circularSize').textContent = step.circularSize;
                }
            }

            reset() {
                this.steps = [];
                this.currentStep = 0;
                this.linearQueue = new Array(this.queueSize).fill(null);
                this.circularQueue = new Array(this.queueSize).fill(null);
                this.linearFront = -1;
                this.linearRear = -1;
                this.circularFront = -1;
                this.circularRear = -1;
                this.linearSize = 0;
                this.circularSize = 0;
                
                this.initializeQueues();
                this.updateUI();
            }
        }

        // Initialize the application
        const queueComparison = new QueueComparison();
    </script>


</body></html>
