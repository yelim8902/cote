<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>단일 연결 리스트 시각화 | 자료구조 시각화</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8f9fa;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            border: 1px solid #e9ecef;
        }

        .control-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
            align-items: end;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-size: 14px;
            font-weight: 600;
            color: #555;
        }

        input[type="text"], input[type="number"], select {
            padding: 12px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            min-width: 200px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #1d4ed8;
            box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.1);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(29, 78, 216, 0.3);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #495057;
            border: 2px solid #dee2e6;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #e9ecef;
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .info-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 15px;
        }

        .info-item {
            text-align: center;
            padding: 15px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .info-item h3 {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666666;
            margin-bottom: 8px;
        }

        .info-item p {
            font-size: 18px;
            font-weight: 700;
            color: #333333;
        }

        .visualization {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            overflow-x: auto;
        }

        .node {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            transition: all 0.5s ease;
        }

        .node-content {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .node-box {
            width: 80px;
            height: 60px;
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            color: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(29, 78, 216, 0.3);
            transition: all 0.5s ease;
        }

        .position-label {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            text-align: center;
            min-width: 80px;
        }

        .node-box.active {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            transform: scale(1.1);
        }

        .node-box.processing {
            background: linear-gradient(135deg, #feca57, #ff9ff3);
            transform: scale(1.15);
        }

        .node-box.success {
            background: linear-gradient(135deg, #26de81, #20bf6b);
        }

        .arrow {
            width: 40px;
            height: 2px;
            background: #1d4ed8;
            position: relative;
            transition: all 0.5s ease;
        }

        .arrow::after {
            content: '';
            position: absolute;
            right: -8px;
            top: -6px;
            width: 0;
            height: 0;
            border-left: 10px solid #1d4ed8;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
        }

        .null-pointer {
            width: 30px;
            height: 30px;
            background: #dc3545;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .result-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #1d4ed8;
        }

        .result-info h4 {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .result-info p {
            font-size: 16px;
            color: #666;
            line-height: 1.5;
        }

        .result-info.success {
            border-left-color: #26de81;
        }

        .result-info.error {
            border-left-color: #ff6b6b;
        }

        .empty-state {
            text-align: center;
            color: #999;
            font-size: 18px;
            padding: 60px 20px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            color: #1d4ed8;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
        .back-link:hover { color: #2563eb; }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .control-panel {
                flex-direction: column;
                align-items: stretch;
            }

            .input-group {
                width: 100%;
            }

            input[type="text"], input[type="number"], select {
                min-width: 100%;
            }

            .info-panel {
                grid-template-columns: 1fr;
            }

            .node-box {
                width: 60px;
                height: 50px;
                font-size: 16px;
            }

            .position-label {
                font-size: 11px;
                min-width: 60px;
            }

            .arrow {
                width: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../../index.html" class="back-link">← 메인으로</a>
        <div class="control-panel">
            <div class="input-group">
                <label for="operation">연산</label>
                <select id="operation">
                    <option value="insert">삽입</option>
                    <option value="delete">삭제</option>
                    <option value="search">탐색</option>
                    <option value="traverse">순회</option>
                </select>
            </div>
            
            <div class="input-group" id="insertTypeGroup" style="display: flex;">
                <label for="insertType">삽입 위치</label>
                <select id="insertType">
                    <option value="head">머리 (O(1))</option>
                    <option value="tail">꼬리 (O(n))</option>
                    <option value="position">위치 지정 (O(n))</option>
                </select>
            </div>
            
            <div class="input-group" id="deleteTypeGroup" style="display: none;">
                <label for="deleteType">삭제 기준</label>
                <select id="deleteType">
                    <option value="head">머리 (O(1))</option>
                    <option value="tail">꼬리 (O(n))</option>
                    <option value="value">값 (O(n))</option>
                    <option value="index">인덱스 (O(n))</option>
                </select>
            </div>

            <div class="input-group" id="valueGroup" style="display: flex;">
                <label for="value" id="valueLabel">값</label>
                <input type="number" id="value" placeholder="값 입력">
            </div>
            
            <div class="input-group" id="positionGroup" style="display: none;">
                <label for="position">위치</label>
                <input type="number" id="position" placeholder="0 = 머리" min="0">
            </div>
            
            <button class="btn btn-primary" id="executeBtn">실행</button>
            <button class="btn btn-secondary" id="resetBtn">리스트 초기화</button>
            <button class="btn btn-secondary" id="initializeBtn">랜덤 초기화</button>
        </div>

        <div class="info-panel">
            <div class="info-item">
                <h3>자료구조</h3>
                <p>단일 연결 리스트</p>
            </div>
            <div class="info-item">
                <h3>리스트 크기</h3>
                <p id="listSize">0</p>
            </div>
            <div class="info-item">
                <h3>시간 복잡도</h3>
                <p id="timeComplexity">O(1)</p>
            </div>
            <div class="info-item">
                <h3>공간 복잡도</h3>
                <p id="spaceComplexity">O(1)</p>
            </div>
        </div>

        <div class="visualization" id="visualization"><div class="empty-state">빈 연결 리스트</div></div>

        <div class="result-info" id="resultInfo">
            <h4>시작할 준비가 되었습니다</h4>
            <p>연산을 선택하고 필요한 값을 입력한 뒤 실행하세요. 단일 연결 리스트는 앞쪽으로만 순회할 수 있습니다.</p>
        </div>
    </div>

    <script>
        class LinkedListVisualizer {
            constructor() {
                this.list = [];
                this.lastOperation = null;
                
                // Wait for DOM to be fully loaded
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', () => {
                        this.initializeEventListeners();
                        this.updateUI();
                    });
                } else {
                    this.initializeEventListeners();
                    this.updateUI();
                }
            }

            initializeEventListeners() {
                const executeBtn = document.getElementById('executeBtn');
                const resetBtn = document.getElementById('resetBtn');
                const initializeBtn = document.getElementById('initializeBtn');
                const operationSelect = document.getElementById('operation');
                const insertTypeSelect = document.getElementById('insertType');
                const deleteTypeSelect = document.getElementById('deleteType');

                if (executeBtn) executeBtn.addEventListener('click', () => this.executeOperation());
                if (resetBtn) resetBtn.addEventListener('click', () => this.resetList());
                if (initializeBtn) initializeBtn.addEventListener('click', () => this.initializeRandomList());
                
                if (operationSelect) {
                    operationSelect.addEventListener('change', () => {
                        this.updateComplexity();
                        this.updateInputVisibility();
                    });
                }
                
                if (insertTypeSelect) {
                    insertTypeSelect.addEventListener('change', () => {
                        this.updateComplexity();
                        this.updateInputVisibility();
                    });
                }
                
                if (deleteTypeSelect) {
                    deleteTypeSelect.addEventListener('change', () => {
                        this.updateComplexity();
                        this.updateInputVisibility();
                    });
                }
                
                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        this.executeOperation();
                    }
                });

                // Initial setup
                this.updateComplexity();
                this.updateInputVisibility();
            }

            executeOperation() {
                const operation = document.getElementById('operation').value;
                const valueInput = document.getElementById('value');
                const positionInput = document.getElementById('position');
                const insertTypeElement = document.getElementById('insertType');
                const deleteTypeElement = document.getElementById('deleteType');
                
                const value = parseInt(valueInput.value);
                const position = parseInt(positionInput.value) || 0;
                const insertType = insertTypeElement ? insertTypeElement.value : 'head';
                const deleteType = deleteTypeElement ? deleteTypeElement.value : 'head';

                let result = null;
                
                switch (operation) {
                    case 'insert':
                        if (insertType === 'position' && (isNaN(value) || position < 0)) {
                            this.showResult('Invalid input', 'Please enter valid value and position for insertion', 'error');
                            return;
                        } else if (insertType !== 'position' && isNaN(value)) {
                            this.showResult('Invalid input', 'Please enter a valid value', 'error');
                            return;
                        }
                        result = this.insertValue(value, insertType, position);
                        break;
                    case 'delete':
                        if ((deleteType === 'value' || deleteType === 'index') && isNaN(value)) {
                            this.showResult('Invalid input', deleteType === 'value' ? 'Please enter a valid value to delete' : 'Please enter a valid index to delete', 'error');
                            return;
                        }
                        result = this.deleteValue(deleteType, value);
                        break;
                    case 'search':
                        if (isNaN(value)) {
                            this.showResult('Invalid input', 'Please enter a valid value to search', 'error');
                            return;
                        }
                        result = this.searchValue(value);
                        break;
                    case 'traverse':
                        result = this.traverseList();
                        break;
                }

                if (result) {
                    this.showResult(result.title, result.description, result.type);
                }
                
                this.updateUI();
            }

            insertValue(value, insertType, position = 0) {
                switch (insertType) {
                    case 'head':
                        this.list.unshift(value);
                        this.lastOperation = { type: 'insert', value: value, position: 0, method: 'head' };
                        return {
                            title: '머리 삽입 성공 (O(1))',
                            description: '값 ' + value + '을(를) 머리에 삽입했습니다. 상수 시간 연산입니다.',
                            type: 'success'
                        };
                    
                    case 'tail':
                        this.list.push(value);
                        this.lastOperation = { type: 'insert', value: value, position: this.list.length - 1, method: 'tail' };
                        return {
                            title: '꼬리 삽입 성공 (O(n))',
                            description: '값 ' + value + '을(를) 꼬리에 삽입했습니다. 리스트 끝까지 순회가 필요합니다.',
                            type: 'success'
                        };
                    
                    case 'position':
                        if (position > this.list.length) {
                            position = this.list.length;
                        }
                        this.list.splice(position, 0, value);
                        this.lastOperation = { type: 'insert', value: value, position: position, method: 'position' };
                        return {
                            title: '위치 삽입 성공 (O(n))',
                            description: '값 ' + value + '을(를) 위치 ' + position + '에 삽입했습니다. 해당 위치까지 순회가 필요합니다.',
                            type: 'success'
                        };
                }
            }

            deleteValue(deleteType, value = null) {
                switch (deleteType) {
                    case 'head':
                        if (this.list.length === 0) {
                            return {
                                title: '빈 리스트에서 삭제 불가',
                                description: '리스트가 비어 있습니다.',
                                type: 'error'
                            };
                        }
                        const headValue = this.list.shift();
                        this.lastOperation = { type: 'delete', value: headValue, index: 0, method: 'head' };
                        return {
                            title: '머리 삭제 성공 (O(1))',
                            description: '값 ' + headValue + '을(를) 머리에서 삭제했습니다. 상수 시간 연산입니다.',
                            type: 'success'
                        };
                    
                    case 'tail':
                        if (this.list.length === 0) {
                            return {
                                title: '빈 리스트에서 삭제 불가',
                                description: '리스트가 비어 있습니다.',
                                type: 'error'
                            };
                        }
                        const tailValue = this.list.pop();
                        this.lastOperation = { type: 'delete', value: tailValue, index: this.list.length, method: 'tail' };
                        return {
                            title: '꼬리 삭제 성공 (O(n))',
                            description: '값 ' + tailValue + '을(를) 꼬리에서 삭제했습니다. 이전 노드를 찾기 위해 순회가 필요합니다.',
                            type: 'success'
                        };
                    
                    case 'value':
                        const index = this.list.indexOf(value);
                        if (index === -1) {
                            return {
                                title: '값을 찾을 수 없음',
                                description: '값 ' + value + '은(는) 리스트에 없습니다.',
                                type: 'error'
                            };
                        }
                        this.list.splice(index, 1);
                        this.lastOperation = { type: 'delete', value: value, index: index, method: 'value' };
                        return {
                            title: '값 삭제 성공 (O(n))',
                            description: '값 ' + value + '을(를) 위치 ' + index + '에서 삭제했습니다. 리스트 탐색이 필요합니다.',
                            type: 'success'
                        };
                    
                    case 'index':
                        if (value < 0 || value >= this.list.length) {
                            return {
                                title: '잘못된 인덱스',
                                description: '인덱스 ' + value + '가 범위를 벗어났습니다 (유효 범위: 0-' + (this.list.length - 1) + ')',
                                type: 'error'
                            };
                        }
                        const deletedValue = this.list[value];
                        this.list.splice(value, 1);
                        this.lastOperation = { type: 'delete', value: deletedValue, index: value, method: 'index' };
                        return {
                            title: '인덱스 삭제 성공 (O(n))',
                            description: '값 ' + deletedValue + '을(를) 인덱스 ' + value + '에서 삭제했습니다. 해당 위치까지 순회가 필요합니다.',
                            type: 'success'
                        };
                }
            }

            searchValue(value) {
                const index = this.list.indexOf(value);
                
                if (index === -1) {
                    return {
                        title: '값을 찾을 수 없음',
                        description: '값 ' + value + '은(는) 리스트에 없습니다.',
                        type: 'error'
                    };
                }
                
                this.lastOperation = { type: 'search', value: value, index: index };
                
                return {
                    title: '탐색 성공 (O(n))',
                    description: '값 ' + value + '을(를) 위치 ' + index + '에서 찾았습니다. 머리부터 ' + (index + 1) + '단계 탐색.',
                    type: 'success'
                };
            }

            traverseList() {
                if (this.list.length === 0) {
                    return {
                        title: '빈 리스트',
                        description: '빈 리스트는 순회할 수 없습니다.',
                        type: 'error'
                    };
                }
                
                this.lastOperation = { type: 'traverse' };
                
                return {
                    title: '순회 완료 (O(n))',
                    description: '머리부터 꼬리까지 ' + this.list.length + '개 노드 순회: [' + this.list.join(', ') + ']',
                    type: 'success'
                };
            }

            initializeRandomList() {
                this.list = [];
                for (let i = 0; i < 5; i++) {
                    this.list.push(Math.floor(Math.random() * 100) + 1);
                }
                
                this.lastOperation = null;
                this.updateUI();
                this.showResult('Random list initialized', 'Generated 5 random values: [' + this.list.join(', ') + ']', 'success');
            }

            resetList() {
                this.list = [];
                this.lastOperation = null;
                this.updateUI();
                this.showResult('List reset', 'The linked list has been cleared', 'success');
            }

            showResult(title, description, type) {
                const resultInfo = document.getElementById('resultInfo');
                if (resultInfo) {
                    resultInfo.className = 'result-info ' + type;
                    resultInfo.innerHTML = '<h4>' + title + '</h4><p>' + description + '</p>';
                }
            }

            updateComplexity() {
                const operation = document.getElementById('operation').value;
                const insertTypeElement = document.getElementById('insertType');
                const deleteTypeElement = document.getElementById('deleteType');
                const timeComplexity = document.getElementById('timeComplexity');
                
                if (!timeComplexity) return;
                
                switch (operation) {
                    case 'insert':
                        const insertType = insertTypeElement ? insertTypeElement.value : 'head';
                        timeComplexity.textContent = insertType === 'head' ? 'O(1)' : 'O(n)';
                        break;
                    case 'delete':
                        const deleteType = deleteTypeElement ? deleteTypeElement.value : 'head';
                        timeComplexity.textContent = deleteType === 'head' ? 'O(1)' : 'O(n)';
                        break;
                    case 'search':
                        timeComplexity.textContent = 'O(n)';
                        break;
                    case 'traverse':
                        timeComplexity.textContent = 'O(n)';
                        break;
                    default:
                        timeComplexity.textContent = '-';
                }
            }

            updateInputVisibility() {
                const operation = document.getElementById('operation').value;
                const insertTypeElement = document.getElementById('insertType');
                const deleteTypeElement = document.getElementById('deleteType');
                
                const insertType = insertTypeElement ? insertTypeElement.value : 'head';
                const deleteType = deleteTypeElement ? deleteTypeElement.value : 'head';
                
                const valueGroup = document.getElementById('valueGroup');
                const valueLabel = document.getElementById('valueLabel');
                const valueInput = document.getElementById('value');
                const positionGroup = document.getElementById('positionGroup');
                const insertTypeGroup = document.getElementById('insertTypeGroup');
                const deleteTypeGroup = document.getElementById('deleteTypeGroup');
                
                if (!valueGroup || !valueLabel || !valueInput || !positionGroup || !insertTypeGroup || !deleteTypeGroup) {
                    return;
                }
                
                // Reset all inputs
                valueGroup.style.display = 'none';
                positionGroup.style.display = 'none';
                insertTypeGroup.style.display = 'none';
                deleteTypeGroup.style.display = 'none';
                
                switch (operation) {
                    case 'insert':
                        insertTypeGroup.style.display = 'flex';
                        valueGroup.style.display = 'flex';
                        valueLabel.textContent = '값';
                        valueInput.placeholder = '값 입력';
                        
                        if (insertType === 'position') {
                            positionGroup.style.display = 'flex';
                        }
                        break;
                        
                    case 'delete':
                        deleteTypeGroup.style.display = 'flex';
                        
                        if (deleteType === 'value') {
                            valueGroup.style.display = 'flex';
                            valueLabel.textContent = '값';
                            valueInput.placeholder = '삭제할 값 입력';
                        } else if (deleteType === 'index') {
                            valueGroup.style.display = 'flex';
                            valueLabel.textContent = '인덱스';
                            valueInput.placeholder = '삭제할 인덱스 입력';
                        }
                        break;
                        
                    case 'search':
                        valueGroup.style.display = 'flex';
                        valueLabel.textContent = '값';
                        valueInput.placeholder = '탐색할 값 입력';
                        break;
                        
                    case 'traverse':
                        // No inputs needed for traverse
                        break;
                }
            }

            updateUI() {
                const listSizeElement = document.getElementById('listSize');

                if (listSizeElement) {
                    listSizeElement.textContent = this.list.length;
                }

                this.renderList();
            }

            renderList() {
                const visualization = document.getElementById('visualization');
                
                if (!visualization) return;
                
                if (this.list.length === 0) {
                    visualization.innerHTML = '<div class="empty-state">빈 연결 리스트</div>';
                    return;
                }

                let html = '';
                
                for (let i = 0; i < this.list.length; i++) {
                    let nodeClass = '';
                    
                    // Highlight based on last operation
                    if (this.lastOperation) {
                        if (this.lastOperation.type === 'insert' && i === this.lastOperation.position) {
                            nodeClass = 'success';
                        } else if (this.lastOperation.type === 'search' && i === this.lastOperation.index) {
                            nodeClass = 'active';
                        }
                    }
                    
                    html += '<div class="node">';
                    
                    // Add HEAD label for first node
                    if (i === 0) {
                        html += '<div style="font-size: 12px; font-weight: 600; color: #1d4ed8; margin-bottom: 5px;">HEAD</div>';
                    }
                    
                    html += '<div class="position-label">Position ' + i + '</div>';
                    html += '<div class="node-content">';
                    html += '<div class="node-box ' + nodeClass + '">' + this.list[i] + '</div>';
                    if (i < this.list.length - 1) {
                        html += '<div class="arrow"></div>';
                    } else {
                        html += '<div class="null-pointer">×</div>';
                    }
                    html += '</div>';
                    html += '</div>';
                }

                visualization.innerHTML = html;
            }
        }

        // Initialize the visualizer when DOM is ready
        const visualizer = new LinkedListVisualizer();
    </script>
