<!DOCTYPE html>

<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배열 시각화 | 자료구조 시각화</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8f9fa;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            border: 1px solid #e9ecef;
        }

        .control-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
            align-items: end;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-size: 14px;
            font-weight: 600;
            color: #555;
        }

        input[type="text"], input[type="number"], select {
            padding: 12px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            min-width: 120px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #1d4ed8;
            box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.1);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 22px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(29, 78, 216, 0.3);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #495057;
            border: 2px solid #dee2e6;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #e9ecef;
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .info-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 15px;
        }

        .info-item {
            text-align: center;
            padding: 15px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .info-label {
            font-size: 14px;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .info-value {
            font-size: 18px;
            font-weight: 700;
            color: #333;
        }

        .visualization {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
        }

        .array-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .array-elements {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .array-element {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            color: white;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.5s ease;
            position: relative;
            box-shadow: 0 4px 15px rgba(29, 78, 216, 0.2);
        }

        .array-element.highlighted {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            transform: scale(1.1);
        }

        .array-element.success {
            background: linear-gradient(135deg, #26de81, #20bf6b);
        }

        .array-indices {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .array-index {
            width: 60px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            color: #666;
        }

        .empty-array {
            color: #999;
            font-style: italic;
            font-size: 18px;
        }

        .result-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
        }

        .result-success {
            background: linear-gradient(135deg, #26de81, #20bf6b);
            color: white;
        }

        .result-error {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
        }

        .result-info {
            background: linear-gradient(135deg, #feca57, #ff9ff3);
            color: white;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            color: #1d4ed8;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
        .back-link:hover { color: #2563eb; }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            .control-panel {
                flex-direction: column;
                align-items: stretch;
            }
            
            .btn {
                margin-top: 10px;
            }
            
            .info-panel {
                grid-template-columns: 1fr;
            }
            
            .array-element {
                width: 50px;
                height: 50px;
                font-size: 14px;
            }
            
            .array-index {
                width: 50px;
            }
        }

        .pc-recommend {
            background: linear-gradient(135deg, #1e3a5f, #1d4ed8);
            color: #f8fafc;
            padding: 10px 16px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .pc-recommend span { opacity: 0.95; }
        @media (max-width: 768px) {
            body { overflow-x: hidden; }
            .container { padding: 16px; margin: 0 8px; max-width: 100%; }
            .control-panel { gap: 10px; }
            .control-panel input, .control-panel select { min-width: 0; width: 100%; }
        }
    </style>
</head>
<body>
    <p class="pc-recommend"><span>💻 PC에서 보시면 시각화를 더 편하게 이용할 수 있습니다.</span></p>
    <div class="container">
        <a href="../../index.html" class="back-link">← 메인으로</a>
        <div class="control-panel">
            <div class="input-group">
                <label for="arrayType">배열 종류</label>
                <select id="arrayType">
                    <option value="static">정적 배열</option>
                    <option value="dynamic">동적 배열</option>
                </select>
            </div>
            
            <div class="input-group">
                <label for="operation">연산</label>
                <select id="operation">
                    <option value="initialize">배열 초기화</option>
                    <option value="access">요소 접근</option>
                    <option value="update">요소 수정</option>
                    <option value="search">선형 탐색</option>
                    <option value="traverse">배열 순회</option>
                    <option value="insert">요소 삽입</option>
                    <option value="delete">요소 삭제</option>
                </select>
            </div>
            
            <div class="input-group" id="sizeGroup" style="display: flex;">
                <label for="arraySize">배열 크기</label>
                <input type="number" id="arraySize" min="1" max="20" value="8">
            </div>
            
            <div class="input-group" id="valuesGroup" style="display: flex;">
                <label for="arrayValues">값 (쉼표로 구분)</label>
                <input type="text" id="arrayValues" placeholder="예: 5,2,8,1,9,3">
            </div>
            
            <div class="input-group" id="indexGroup" style="display: none;">
                <label for="targetIndex">인덱스</label>
                <input type="number" id="targetIndex" min="0" value="0">
            </div>
            
            <div class="input-group" id="valueGroup" style="display: none;">
                <label for="targetValue">값</label>
                <input type="number" id="targetValue" value="10">
            </div>
            
            <div class="input-group" id="searchGroup" style="display: none;">
                <label for="searchValue">찾을 값</label>
                <input type="number" id="searchValue" value="5">
            </div>
            
            <div class="input-group" id="insertIndexGroup" style="display: none;">
                <label for="insertIndex">삽입 인덱스</label>
                <input type="number" id="insertIndex" min="0" value="0">
            </div>
            
            <div class="input-group" id="insertValueGroup" style="display: none;">
                <label for="insertValue">삽입할 값</label>
                <input type="number" id="insertValue" value="10">
            </div>
            
            <div class="input-group" id="deleteIndexGroup" style="display: none;">
                <label for="deleteIndex">삭제할 인덱스</label>
                <input type="number" id="deleteIndex" min="0" value="0">
            </div>
            
            <button class="btn btn-primary" onclick="executeOperation()">실행</button>
            <button class="btn btn-secondary" onclick="resetArray()">초기화</button>
        </div>

        <div class="info-panel">
            <div class="info-item">
                <div class="info-label">자료구조</div>
                <div class="info-value" id="arrayTypeDisplay">정적 배열</div>
            </div>
            <div class="info-item">
                <div class="info-label">연산</div>
                <div class="info-value" id="currentOperation">초기화</div>
            </div>
            <div class="info-item">
                <div class="info-label">시간 복잡도</div>
                <div class="info-value" id="timeComplexity">O(n)</div>
            </div>
            <div class="info-item">
                <div class="info-label">공간 복잡도</div>
                <div class="info-value" id="spaceComplexity">O(n)</div>
            </div>
        </div>

        <div class="visualization">
            <div class="array-container">
                <div class="array-indices" id="arrayIndices"><div class="array-index">0</div><div class="array-index">1</div><div class="array-index">2</div><div class="array-index">3</div><div class="array-index">4</div><div class="array-index">5</div><div class="array-index">6</div><div class="array-index">7</div></div>
                <div class="array-elements" id="arrayElements"><div class="array-element" id="element-0">76</div><div class="array-element" id="element-1">79</div><div class="array-element" id="element-2">44</div><div class="array-element" id="element-3">52</div><div class="array-element" id="element-4">59</div><div class="array-element" id="element-5">93</div><div class="array-element" id="element-6">91</div><div class="array-element" id="element-7">96</div></div>
            </div>
            <div id="resultMessage"></div>
        </div>
    </div>

    <script>
        class StaticArrayVisualizer {
            constructor() {
                this.array = [];
                this.size = 0;
                this.capacity = 0;
                this.isStatic = true;
                this.initializeEventListeners();
                this.updateComplexity();
            }

            initializeEventListeners() {
                const operationSelect = document.getElementById('operation');
                const arrayTypeSelect = document.getElementById('arrayType');
                
                operationSelect.addEventListener('change', () => {
                    this.updateInputVisibility();
                    this.updateComplexity();
                });

                arrayTypeSelect.addEventListener('change', () => {
                    this.isStatic = arrayTypeSelect.value === 'static';
                    this.updateArrayTypeDisplay();
                    this.updateComplexity();
                });

                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        executeOperation();
                    } else if (e.key === 'Escape') {
                        resetArray();
                    }
                });
            }

            updateArrayTypeDisplay() {
                const arrayTypeDisplay = document.getElementById('arrayTypeDisplay');
                arrayTypeDisplay.textContent = this.isStatic ? '정적 배열' : '동적 배열';
            }

            updateInputVisibility() {
                const operation = document.getElementById('operation').value;
                
                // Hide all conditional inputs
                document.getElementById('sizeGroup').style.display = 'none';
                document.getElementById('valuesGroup').style.display = 'none';
                document.getElementById('indexGroup').style.display = 'none';
                document.getElementById('valueGroup').style.display = 'none';
                document.getElementById('searchGroup').style.display = 'none';
                document.getElementById('insertIndexGroup').style.display = 'none';
                document.getElementById('insertValueGroup').style.display = 'none';
                document.getElementById('deleteIndexGroup').style.display = 'none';

                // Show relevant inputs based on operation
                switch(operation) {
                    case 'initialize':
                        document.getElementById('sizeGroup').style.display = 'flex';
                        document.getElementById('valuesGroup').style.display = 'flex';
                        break;
                    case 'access':
                        document.getElementById('indexGroup').style.display = 'flex';
                        break;
                    case 'update':
                        document.getElementById('indexGroup').style.display = 'flex';
                        document.getElementById('valueGroup').style.display = 'flex';
                        break;
                    case 'search':
                        document.getElementById('searchGroup').style.display = 'flex';
                        break;
                    case 'insert':
                        document.getElementById('insertIndexGroup').style.display = 'flex';
                        document.getElementById('insertValueGroup').style.display = 'flex';
                        break;
                    case 'delete':
                        document.getElementById('deleteIndexGroup').style.display = 'flex';
                        break;
                }
            }

            updateComplexity() {
                const operation = document.getElementById('operation').value;
                const isDynamic = !this.isStatic;
                
                const complexities = {
                    'initialize': { time: 'O(n)', space: 'O(n)' },
                    'access': { time: 'O(1)', space: 'O(1)' },
                    'update': { time: 'O(1)', space: 'O(1)' },
                    'search': { time: 'O(n)', space: 'O(1)' },
                    'traverse': { time: 'O(n)', space: 'O(1)' },
                    'insert': { 
                        time: isDynamic ? 'O(n)' : 'O(n)', 
                        space: isDynamic ? 'O(1)*' : 'O(1)' 
                    },
                    'delete': { time: 'O(n)', space: 'O(1)' }
                };

                const opNames = {
                    'initialize': '배열 초기화',
                    'access': '요소 접근',
                    'update': '요소 수정',
                    'search': '선형 탐색',
                    'traverse': '배열 순회',
                    'insert': '요소 삽입',
                    'delete': '요소 삭제'
                };
                document.getElementById('currentOperation').textContent = opNames[operation] || operation;
                document.getElementById('timeComplexity').textContent = complexities[operation].time;
                document.getElementById('spaceComplexity').textContent = complexities[operation].space;
            }

            initializeArray(size, values) {
                this.capacity = size;
                this.array = [];
                
                if (values && values.length > 0) {
                    // Use only provided values, don't fill remaining slots
                    for (let i = 0; i < Math.min(size, values.length); i++) {
                        this.array[i] = values[i];
                    }
                    // Leave remaining slots empty (don't add random values)
                } else {
                    // Generate random values only if no values provided
                    for (let i = 0; i < size; i++) {
                        this.array[i] = Math.floor(Math.random() * 100);
                    }
                }
                
                this.size = this.array.length;
                this.renderArray();
                
                if (values && values.length > 0) {
                    const emptySlots = this.capacity - this.array.length;
                    this.showResult(`배열이 ${this.array.length}개 요소로 초기화되었습니다. 빈 칸 ${emptySlots}개`, 'success');
                } else {
                    this.showResult(`배열이 크기 ${this.capacity}(으)로 초기화되었습니다.`, 'success');
                }
            }

            accessElement(index) {
                if (this.array.length === 0) {
                    this.showResult('배열이 초기화되지 않았습니다.', 'error');
                    return;
                }
                
                if (index < 0 || index >= this.array.length) {
                    this.showResult(`인덱스 ${index}가 범위를 벗어났습니다.`, 'error');
                    return;
                }

                this.highlightElement(index);
                this.showResult(`Element at index ${index}: ${this.array[index]}`, 'info');
            }

            updateElement(index, value) {
                if (this.array.length === 0) {
                    this.showResult('배열이 초기화되지 않았습니다.', 'error');
                    return;
                }
                
                if (index < 0 || index >= this.array.length) {
                    this.showResult(`인덱스 ${index}가 범위를 벗어났습니다.`, 'error');
                    return;
                }

                const oldValue = this.array[index];
                this.array[index] = value;
                this.renderArray();
                this.highlightElement(index, 'success');
                this.showResult(`인덱스 ${index}의 값을 ${oldValue} → ${value}(으)로 수정했습니다.`, 'success');
            }

            insertElement(index, value) {
                if (this.array.length === 0) {
                    this.showResult('배열이 초기화되지 않았습니다.', 'error');
                    return;
                }

                if (index < 0 || index > this.array.length) {
                    this.showResult(`삽입 인덱스 ${index}가 범위를 벗어났습니다.`, 'error');
                    return;
                }

                if (this.isStatic) {
                    // Static array: check if there's space
                    if (this.array.length >= this.capacity) {
                        this.showResult('Cannot insert: Static array is at full capacity!', 'error');
                        return;
                    }
                    
                    // Shift elements to the right
                    for (let i = this.array.length; i > index; i--) {
                        this.array[i] = this.array[i - 1];
                    }
                    this.array[index] = value;
                } else {
                    // Dynamic array: can always insert
                    this.array.splice(index, 0, value);
                }

                this.size = this.array.length;
                this.renderArray();
                this.highlightElement(index, 'success');
                
                const arrayType = this.isStatic ? '정적' : '동적';
                this.showResult(`인덱스 ${index}에 값 ${value}를 삽입했습니다 (${arrayType} 배열).`, 'success');
            }

            deleteElement(index) {
                if (this.array.length === 0) {
                    this.showResult('배열이 초기화되지 않았습니다.', 'error');
                    return;
                }

                if (index < 0 || index >= this.array.length) {
                    this.showResult(`인덱스 ${index}가 범위를 벗어났습니다.`, 'error');
                    return;
                }

                const deletedValue = this.array[index];

                if (this.isStatic) {
                    // Static array: shift elements left
                    for (let i = index; i < this.array.length - 1; i++) {
                        this.array[i] = this.array[i + 1];
                    }
                    this.array.length = this.array.length - 1;
                } else {
                    // Dynamic array: use splice
                    this.array.splice(index, 1);
                }

                this.size = this.array.length;
                this.renderArray();
                
                const arrayType = this.isStatic ? '정적' : '동적';
                this.showResult(`인덱스 ${index}에서 값 ${deletedValue}를 삭제했습니다 (${arrayType} 배열).`, 'success');
            }

            searchElement(value) {
                if (this.array.length === 0) {
                    this.showResult('배열이 초기화되지 않았습니다.', 'error');
                    return;
                }

                for (let i = 0; i < this.array.length; i++) {
                    if (this.array[i] === value) {
                        this.highlightElement(i, 'success');
                        this.showResult(`Found ${value} at index ${i}`, 'success');
                        return;
                    }
                }
                
                this.showResult(`값 ${value}를 배열에서 찾을 수 없습니다.`, 'error');
            }

            traverseArray() {
                if (this.array.length === 0) {
                    this.showResult('배열이 초기화되지 않았습니다.', 'error');
                    return;
                }

                let result = '순회 결과: ';
                for (let i = 0; i < this.array.length; i++) {
                    result += `[${i}]=${this.array[i]}`;
                    if (i < this.array.length - 1) result += ', ';
                }
                
                this.showResult(result, 'info');
                
                // Highlight all elements briefly
                const elements = document.querySelectorAll('.array-element');
                elements.forEach((element, index) => {
                    setTimeout(() => {
                        element.classList.add('highlighted');
                        setTimeout(() => {
                            element.classList.remove('highlighted');
                        }, 300);
                    }, index * 100);
                });
            }

            renderArray() {
                const elementsContainer = document.getElementById('arrayElements');
                const indicesContainer = document.getElementById('arrayIndices');
                
                if (this.array.length === 0) {
                    elementsContainer.innerHTML = '<div class="empty-array">배열이 초기화되지 않았습니다</div>';
                    indicesContainer.innerHTML = '';
                    return;
                }

                // Render elements
                elementsContainer.innerHTML = '';
                this.array.forEach((value, index) => {
                    const element = document.createElement('div');
                    element.className = 'array-element';
                    element.textContent = value;
                    element.id = `element-${index}`;
                    elementsContainer.appendChild(element);
                });

                // For static arrays, show empty slots if capacity > current size
                if (this.isStatic && this.capacity > this.array.length) {
                    for (let i = this.array.length; i < this.capacity; i++) {
                        const element = document.createElement('div');
                        element.className = 'array-element empty-slot';
                        element.textContent = '—';
                        element.style.opacity = '0.3';
                        element.style.background = 'linear-gradient(135deg, #dee2e6, #adb5bd)';
                        element.id = `element-${i}`;
                        elementsContainer.appendChild(element);
                    }
                }

                // Render indices
                indicesContainer.innerHTML = '';
                const totalSlots = this.isStatic ? this.capacity : this.array.length;
                for (let i = 0; i < totalSlots; i++) {
                    const indexElement = document.createElement('div');
                    indexElement.className = 'array-index';
                    indexElement.textContent = i;
                    if (this.isStatic && i >= this.array.length) {
                        indexElement.style.opacity = '0.3';
                    }
                    indicesContainer.appendChild(indexElement);
                }
            }

            highlightElement(index, type = 'highlighted') {
                // Clear previous highlights
                document.querySelectorAll('.array-element').forEach(el => {
                    el.classList.remove('highlighted', 'success');
                });

                const element = document.getElementById(`element-${index}`);
                if (element) {
                    element.classList.add(type);
                    
                    // Auto-remove highlight after delay
                    setTimeout(() => {
                        element.classList.remove(type);
                    }, 2000);
                }
            }

            showResult(message, type) {
                const resultDiv = document.getElementById('resultMessage');
                resultDiv.innerHTML = `<div class="result-message result-${type}">${message}</div>`;
                
                // Auto-clear message after delay
                setTimeout(() => {
                    resultDiv.innerHTML = '';
                }, 3000);
            }

            reset() {
                this.array = [];
                this.size = 0;
                this.capacity = 0;
                this.renderArray();
                document.getElementById('resultMessage').innerHTML = '';
            }
        }

        // Global instance
        const visualizer = new StaticArrayVisualizer();

        // Global functions for buttons
        function executeOperation() {
            const operation = document.getElementById('operation').value;
            
            switch(operation) {
                case 'initialize':
                    const size = parseInt(document.getElementById('arraySize').value);
                    const valuesStr = document.getElementById('arrayValues').value.trim();
                    const values = valuesStr ? valuesStr.split(',').map(v => parseInt(v.trim())).filter(v => !isNaN(v)) : [];
                    visualizer.initializeArray(size, values);
                    break;
                    
                case 'access':
                    const accessIndex = parseInt(document.getElementById('targetIndex').value);
                    visualizer.accessElement(accessIndex);
                    break;
                    
                case 'update':
                    const updateIndex = parseInt(document.getElementById('targetIndex').value);
                    const newValue = parseInt(document.getElementById('targetValue').value);
                    visualizer.updateElement(updateIndex, newValue);
                    break;
                    
                case 'search':
                    const searchValue = parseInt(document.getElementById('searchValue').value);
                    visualizer.searchElement(searchValue);
                    break;
                    
                case 'traverse':
                    visualizer.traverseArray();
                    break;
                    
                case 'insert':
                    const insertIndex = parseInt(document.getElementById('insertIndex').value);
                    const insertValue = parseInt(document.getElementById('insertValue').value);
                    visualizer.insertElement(insertIndex, insertValue);
                    break;
                    
                case 'delete':
                    const deleteIndex = parseInt(document.getElementById('deleteIndex').value);
                    visualizer.deleteElement(deleteIndex);
                    break;
            }
        }

        function resetArray() {
            visualizer.reset();
        }

        // Initialize the interface
        document.addEventListener('DOMContentLoaded', () => {
            visualizer.updateInputVisibility();
        });
    </script>


</body></html>
