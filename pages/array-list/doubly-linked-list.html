<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이중 연결 리스트 시각화 | 자료구조 시각화</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8f9fa;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            border: 1px solid #e9ecef;
        }

        .control-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
            align-items: end;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-size: 14px;
            font-weight: 600;
            color: #555;
        }

        input[type="text"], input[type="number"], select {
            padding: 12px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            min-width: 200px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #1d4ed8;
            box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.1);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(29, 78, 216, 0.3);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #495057;
            border: 2px solid #dee2e6;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #e9ecef;
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .info-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 15px;
        }

        .info-item {
            text-align: center;
            padding: 15px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .info-item h3 {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666666;
            margin-bottom: 8px;
        }

        .info-item p {
            font-size: 18px;
            font-weight: 700;
            color: #333333;
        }

        .visualization {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            min-height: 350px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 15px;
            overflow-x: auto;
        }

        .node {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            transition: all 0.5s ease;
        }

        .node-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .node-box {
            width: 100px;
            height: 80px;
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            color: white;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(29, 78, 216, 0.3);
            transition: all 0.5s ease;
            position: relative;
        }

        .node-value {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .node-pointers {
            font-size: 10px;
            display: flex;
            gap: 8px;
        }

        .position-label {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            text-align: center;
            min-width: 100px;
        }

        .node-box.active {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            transform: scale(1.1);
        }

        .node-box.processing {
            background: linear-gradient(135deg, #feca57, #ff9ff3);
            transform: scale(1.15);
        }

        .node-box.success {
            background: linear-gradient(135deg, #26de81, #20bf6b);
        }

        .arrows-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
            align-items: center;
            justify-content: center;
            height: 80px;
        }

        .arrow {
            width: 50px;
            height: 2px;
            background: #1d4ed8;
            position: relative;
            transition: all 0.5s ease;
        }

        .arrow.forward {
            background: #1d4ed8;
        }

        .arrow.backward {
            background: #28a745;
        }

        .arrow::after {
            content: '';
            position: absolute;
            right: -8px;
            top: -6px;
            width: 0;
            height: 0;
            border-left: 10px solid #1d4ed8;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
        }

        .arrow.backward::after {
            border-left-color: #28a745;
        }

        .arrow.backward::before {
            content: '';
            position: absolute;
            left: -8px;
            top: -6px;
            width: 0;
            height: 0;
            border-right: 10px solid #28a745;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
        }

        .null-pointer {
            width: 35px;
            height: 35px;
            background: #dc3545;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            font-weight: bold;
        }

        .head-tail-labels {
            display: none;
        }

        .result-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #1d4ed8;
        }

        .result-info h4 {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .result-info p {
            font-size: 16px;
            color: #666;
            line-height: 1.5;
        }

        .result-info.success {
            border-left-color: #26de81;
        }

        .result-info.error {
            border-left-color: #ff6b6b;
        }

        .empty-state {
            text-align: center;
            color: #999;
            font-size: 18px;
            padding: 60px 20px;
        }

        .traversal-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 10px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            color: #1d4ed8;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
        .back-link:hover { color: #2563eb; }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .control-panel {
                flex-direction: column;
                align-items: stretch;
            }

            .input-group {
                width: 100%;
            }

            input[type="text"], input[type="number"], select {
                min-width: 100%;
            }

            .info-panel {
                grid-template-columns: 1fr;
            }

            .node-box {
                width: 80px;
                height: 65px;
                font-size: 16px;
            }

            .position-label {
                font-size: 11px;
                min-width: 80px;
            }

            .arrow {
                width: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../../index.html" class="back-link">← 메인으로</a>
        <div class="control-panel">
            <div class="input-group">
                <label for="operation">연산</label>
                <select id="operation">
                    <option value="insert">삽입</option>
                    <option value="delete">삭제</option>
                    <option value="search">탐색</option>
                    <option value="traverse">순회</option>
                </select>
            </div>
            
            <div class="input-group" id="insertTypeGroup" style="display: flex;">
                <label for="insertType">삽입 위치</label>
                <select id="insertType">
                    <option value="head">머리 (O(1))</option>
                    <option value="tail">꼬리 (O(1))</option>
                    <option value="position">위치 지정 (O(n))</option>
                </select>
            </div>
            
            <div class="input-group" id="deleteTypeGroup" style="display: none;">
                <label for="deleteType">삭제 기준</label>
                <select id="deleteType">
                    <option value="head">머리 (O(1))</option>
                    <option value="tail">꼬리 (O(1))</option>
                    <option value="value">값 (O(n))</option>
                    <option value="index">인덱스 (O(n))</option>
                </select>
            </div>

            <div class="input-group" id="searchTypeGroup" style="display: none;">
                <label for="searchType">탐색 시작점</label>
                <select id="searchType">
                    <option value="head">머리</option>
                    <option value="tail">꼬리</option>
                </select>
            </div>

            <div class="input-group" id="traverseTypeGroup" style="display: none;">
                <label for="traverseType">순회 방향</label>
                <select id="traverseType">
                    <option value="forward">앞으로 (머리→꼬리)</option>
                    <option value="backward">뒤로 (꼬리→머리)</option>
                </select>
            </div>

            <div class="input-group" id="valueGroup" style="display: flex;">
                <label for="value" id="valueLabel">값</label>
                <input type="number" id="value" placeholder="값 입력">
            </div>
            
            <div class="input-group" id="positionGroup" style="display: none;">
                <label for="position">위치</label>
                <input type="number" id="position" placeholder="0 = 머리" min="0">
            </div>
            
            <button class="btn btn-primary" id="executeBtn">실행</button>
            <button class="btn btn-secondary" id="resetBtn">리스트 초기화</button>
            <button class="btn btn-secondary" id="initializeBtn">랜덤 초기화</button>
        </div>

        <div class="info-panel">
            <div class="info-item">
                <h3>자료구조</h3>
                <p>이중 연결 리스트</p>
            </div>
            <div class="info-item">
                <h3>리스트 크기</h3>
                <p id="listSize">0</p>
            </div>
            <div class="info-item">
                <h3>시간 복잡도</h3>
                <p id="timeComplexity">O(1)</p>
            </div>
            <div class="info-item">
                <h3>공간 복잡도</h3>
                <p id="spaceComplexity">O(1)</p>
            </div>
        </div>

        <div class="visualization" id="visualization"><div class="empty-state">빈 이중 연결 리스트</div></div>

        <div class="result-info" id="resultInfo">
            <h4>시작할 준비가 되었습니다</h4>
            <p>연산을 선택하고 필요한 값을 입력한 뒤 실행하세요. 이중 연결 리스트는 양방향 순회를 지원합니다.</p>
        </div>
    </div>

    <script>
        class DoublyLinkedListVisualizer {
            constructor() {
                this.list = [];
                this.lastOperation = null;
                
                // Wait for DOM to be fully loaded
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', () => {
                        this.initializeEventListeners();
                        this.updateUI();
                    });
                } else {
                    this.initializeEventListeners();
                    this.updateUI();
                }
            }

            initializeEventListeners() {
                const executeBtn = document.getElementById('executeBtn');
                const resetBtn = document.getElementById('resetBtn');
                const initializeBtn = document.getElementById('initializeBtn');
                const operationSelect = document.getElementById('operation');
                const insertTypeSelect = document.getElementById('insertType');
                const deleteTypeSelect = document.getElementById('deleteType');
                const searchTypeSelect = document.getElementById('searchType');
                const traverseTypeSelect = document.getElementById('traverseType');

                if (executeBtn) executeBtn.addEventListener('click', () => this.executeOperation());
                if (resetBtn) resetBtn.addEventListener('click', () => this.resetList());
                if (initializeBtn) initializeBtn.addEventListener('click', () => this.initializeRandomList());
                
                if (operationSelect) {
                    operationSelect.addEventListener('change', () => {
                        this.updateComplexity();
                        this.updateInputVisibility();
                    });
                }
                
                if (insertTypeSelect) {
                    insertTypeSelect.addEventListener('change', () => {
                        this.updateComplexity();
                        this.updateInputVisibility();
                    });
                }
                
                if (deleteTypeSelect) {
                    deleteTypeSelect.addEventListener('change', () => {
                        this.updateComplexity();
                        this.updateInputVisibility();
                    });
                }

                if (searchTypeSelect) {
                    searchTypeSelect.addEventListener('change', () => {
                        this.updateComplexity();
                        this.updateInputVisibility();
                    });
                }

                if (traverseTypeSelect) {
                    traverseTypeSelect.addEventListener('change', () => {
                        this.updateInputVisibility();
                    });
                }
                
                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        this.executeOperation();
                    }
                });

                // Initial setup
                this.updateComplexity();
                this.updateInputVisibility();
            }

            executeOperation() {
                const operation = document.getElementById('operation').value;
                const valueInput = document.getElementById('value');
                const positionInput = document.getElementById('position');
                const insertTypeElement = document.getElementById('insertType');
                const deleteTypeElement = document.getElementById('deleteType');
                const searchTypeElement = document.getElementById('searchType');
                const traverseTypeElement = document.getElementById('traverseType');
                
                const value = parseInt(valueInput.value);
                const position = parseInt(positionInput.value) || 0;
                const insertType = insertTypeElement ? insertTypeElement.value : 'head';
                const deleteType = deleteTypeElement ? deleteTypeElement.value : 'head';
                const searchType = searchTypeElement ? searchTypeElement.value : 'head';
                const traverseType = traverseTypeElement ? traverseTypeElement.value : 'forward';

                let result = null;
                
                switch (operation) {
                    case 'insert':
                        if (insertType === 'position' && (isNaN(value) || position < 0)) {
                            this.showResult('Invalid input', 'Please enter valid value and position for insertion', 'error');
                            return;
                        } else if (insertType !== 'position' && isNaN(value)) {
                            this.showResult('Invalid input', 'Please enter a valid value', 'error');
                            return;
                        }
                        result = this.insertValue(value, insertType, position);
                        break;
                    case 'delete':
                        if ((deleteType === 'value' || deleteType === 'index') && isNaN(value)) {
                            this.showResult('Invalid input', deleteType === 'value' ? 'Please enter a valid value to delete' : 'Please enter a valid index to delete', 'error');
                            return;
                        }
                        result = this.deleteValue(deleteType, value);
                        break;
                    case 'search':
                        if (isNaN(value)) {
                            this.showResult('Invalid input', 'Please enter a valid value to search', 'error');
                            return;
                        }
                        result = this.searchValue(value, searchType);
                        break;
                    case 'traverse':
                        result = this.traverseList(traverseType);
                        break;
                }

                if (result) {
                    this.showResult(result.title, result.description, result.type);
                }
                
                this.updateUI();
            }

            insertValue(value, insertType, position = 0) {
                switch (insertType) {
                    case 'head':
                        this.list.unshift(value);
                        this.lastOperation = { type: 'insert', value: value, position: 0, method: 'head' };
                        return {
                            title: 'Head insertion successful (O(1))',
                            description: 'Value ' + value + ' inserted at head. Constant time operation!',
                            type: 'success'
                        };
                    
                    case 'tail':
                        this.list.push(value);
                        this.lastOperation = { type: 'insert', value: value, position: this.list.length - 1, method: 'tail' };
                        return {
                            title: 'Tail insertion successful (O(1))',
                            description: 'Value ' + value + ' inserted at tail. Constant time operation!',
                            type: 'success'
                        };
                    
                    case 'position':
                        if (position > this.list.length) {
                            position = this.list.length;
                        }
                        this.list.splice(position, 0, value);
                        this.lastOperation = { type: 'insert', value: value, position: position, method: 'position' };
                        return {
                            title: 'Position insertion successful (O(n))',
                            description: 'Value ' + value + ' inserted at position ' + position + '. Required traversal to position.',
                            type: 'success'
                        };
                }
            }

            deleteValue(deleteType, value = null) {
                switch (deleteType) {
                    case 'head':
                        if (this.list.length === 0) {
                            return {
                                title: 'Cannot delete from empty list',
                                description: 'The list is empty',
                                type: 'error'
                            };
                        }
                        const headValue = this.list.shift();
                        this.lastOperation = { type: 'delete', value: headValue, index: 0, method: 'head' };
                        return {
                            title: 'Head deletion successful (O(1))',
                            description: 'Value ' + headValue + ' deleted from head. Constant time operation!',
                            type: 'success'
                        };
                    
                    case 'tail':
                        if (this.list.length === 0) {
                            return {
                                title: 'Cannot delete from empty list',
                                description: 'The list is empty',
                                type: 'error'
                            };
                        }
                        const tailValue = this.list.pop();
                        this.lastOperation = { type: 'delete', value: tailValue, index: this.list.length, method: 'tail' };
                        return {
                            title: 'Tail deletion successful (O(1))',
                            description: 'Value ' + tailValue + ' deleted from tail. Constant time operation!',
                            type: 'success'
                        };
                    
                    case 'value':
                        const index = this.list.indexOf(value);
                        if (index === -1) {
                            return {
                                title: 'Value not found',
                                description: 'Value ' + value + ' does not exist in the list',
                                type: 'error'
                            };
                        }
                        this.list.splice(index, 1);
                        this.lastOperation = { type: 'delete', value: value, index: index, method: 'value' };
                        return {
                            title: 'Value deletion successful (O(n))',
                            description: 'Value ' + value + ' deleted from position ' + index + '. Required search through list.',
                            type: 'success'
                        };
                    
                    case 'index':
                        if (value < 0 || value >= this.list.length) {
                            return {
                                title: 'Invalid index',
                                description: 'Index ' + value + ' is out of bounds (valid range: 0-' + (this.list.length - 1) + ')',
                                type: 'error'
                            };
                        }
                        const deletedValue = this.list[value];
                        this.list.splice(value, 1);
                        this.lastOperation = { type: 'delete', value: deletedValue, index: value, method: 'index' };
                        return {
                            title: 'Index deletion successful (O(n))',
                            description: 'Value ' + deletedValue + ' deleted from index ' + value + '. Required traversal to position.',
                            type: 'success'
                        };
                }
            }

            searchValue(value, searchType) {
                if (this.list.length === 0) {
                    return {
                        title: 'Empty list',
                        description: 'Cannot search in an empty list',
                        type: 'error'
                    };
                }
                
                let index = -1;
                let searchDirection = '';
                let stepsFromHead = 0;
                let stepsFromTail = 0;
                
                // Calculate steps from both ends
                for (let i = 0; i < this.list.length; i++) {
                    if (this.list[i] === value) {
                        index = i;
                        stepsFromHead = i + 1;
                        stepsFromTail = this.list.length - i;
                        break;
                    }
                }
                
                if (index === -1) {
                    return {
                        title: 'Value not found',
                        description: 'Value ' + value + ' is not in the list',
                        type: 'error'
                    };
                }
                
                switch (searchType) {
                    case 'optimal':
                        searchDirection = stepsFromHead <= stepsFromTail ? 'from head' : 'from tail';
                        this.lastOperation = { type: 'search', value: value, index: index, method: 'optimal' };
                        return {
                            title: 'Optimal search successful',
                            description: 'Value ' + value + ' found at position ' + index + '. Searched ' + searchDirection + ' (' + Math.min(stepsFromHead, stepsFromTail) + ' steps vs ' + Math.max(stepsFromHead, stepsFromTail) + ' steps).',
                            type: 'success'
                        };
                    
                    case 'head':
                        this.lastOperation = { type: 'search', value: value, index: index, method: 'head' };
                        return {
                            title: 'Head search successful',
                            description: 'Value ' + value + ' found at position ' + index + '. Searched from head (' + stepsFromHead + ' steps).',
                            type: 'success'
                        };
                    
                    case 'tail':
                        this.lastOperation = { type: 'search', value: value, index: index, method: 'tail' };
                        return {
                            title: 'Tail search successful',
                            description: 'Value ' + value + ' found at position ' + index + '. Searched from tail (' + stepsFromTail + ' steps).',
                            type: 'success'
                        };
                }
            }

            traverseList(direction = 'forward') {
                if (this.list.length === 0) {
                    return {
                        title: 'Empty list',
                        description: 'Cannot traverse an empty list',
                        type: 'error'
                    };
                }
                
                this.lastOperation = { type: 'traverse', direction: direction };
                
                let traversalOrder = direction === 'forward' ? this.list.slice() : this.list.slice().reverse();
                let directionText = direction === 'forward' ? 'Head to Tail' : 'Tail to Head';
                
                return {
                    title: 'Traversal complete',
                    description: 'Traversed ' + this.list.length + ' nodes (' + directionText + '): [' + traversalOrder.join(', ') + ']',
                    type: 'success'
                };
            }

            initializeRandomList() {
                this.list = [];
                for (let i = 0; i < 5; i++) {
                    this.list.push(Math.floor(Math.random() * 100) + 1);
                }
                
                this.lastOperation = null;
                this.updateUI();
                this.showResult('Random list initialized', 'Generated 5 random values: [' + this.list.join(', ') + ']', 'success');
            }

            resetList() {
                this.list = [];
                this.lastOperation = null;
                this.updateUI();
                this.showResult('List reset', 'The doubly linked list has been cleared', 'success');
            }

            showResult(title, description, type) {
                const resultInfo = document.getElementById('resultInfo');
                if (resultInfo) {
                    resultInfo.className = 'result-info ' + type;
                    resultInfo.innerHTML = '<h4>' + title + '</h4><p>' + description + '</p>';
                }
            }

            updateComplexity() {
                const operation = document.getElementById('operation').value;
                const insertTypeElement = document.getElementById('insertType');
                const deleteTypeElement = document.getElementById('deleteType');
                const searchTypeElement = document.getElementById('searchType');
                const timeComplexity = document.getElementById('timeComplexity');
                
                if (!timeComplexity) return;
                
                switch (operation) {
                    case 'insert':
                        const insertType = insertTypeElement ? insertTypeElement.value : 'head';
                        timeComplexity.textContent = (insertType === 'head' || insertType === 'tail') ? 'O(1)' : 'O(n)';
                        break;
                    case 'delete':
                        const deleteType = deleteTypeElement ? deleteTypeElement.value : 'head';
                        timeComplexity.textContent = (deleteType === 'head' || deleteType === 'tail') ? 'O(1)' : 'O(n)';
                        break;
                    case 'search':
                        const searchType = searchTypeElement ? searchTypeElement.value : 'head';
                        timeComplexity.textContent = 'O(n)';
                        break;
                    case 'traverse':
                        timeComplexity.textContent = 'O(n)';
                        break;
                    default:
                        timeComplexity.textContent = '-';
                }
            }

            updateInputVisibility() {
                const operation = document.getElementById('operation').value;
                const insertTypeElement = document.getElementById('insertType');
                const deleteTypeElement = document.getElementById('deleteType');
                const searchTypeElement = document.getElementById('searchType');
                
                const insertType = insertTypeElement ? insertTypeElement.value : 'head';
                const deleteType = deleteTypeElement ? deleteTypeElement.value : 'head';
                const searchType = searchTypeElement ? searchTypeElement.value : 'head';
                
                const valueGroup = document.getElementById('valueGroup');
                const valueLabel = document.getElementById('valueLabel');
                const valueInput = document.getElementById('value');
                const positionGroup = document.getElementById('positionGroup');
                const insertTypeGroup = document.getElementById('insertTypeGroup');
                const deleteTypeGroup = document.getElementById('deleteTypeGroup');
                const searchTypeGroup = document.getElementById('searchTypeGroup');
                const traverseTypeGroup = document.getElementById('traverseTypeGroup');
                
                if (!valueGroup || !valueLabel || !valueInput || !positionGroup || !insertTypeGroup || !deleteTypeGroup || !searchTypeGroup || !traverseTypeGroup) {
                    return;
                }
                
                // Reset all inputs
                valueGroup.style.display = 'none';
                positionGroup.style.display = 'none';
                insertTypeGroup.style.display = 'none';
                deleteTypeGroup.style.display = 'none';
                searchTypeGroup.style.display = 'none';
                traverseTypeGroup.style.display = 'none';
                
                switch (operation) {
                    case 'insert':
                        insertTypeGroup.style.display = 'flex';
                        valueGroup.style.display = 'flex';
                        valueLabel.textContent = 'Value';
                        valueInput.placeholder = 'Enter value';
                        
                        if (insertType === 'position') {
                            positionGroup.style.display = 'flex';
                        }
                        break;
                        
                    case 'delete':
                        deleteTypeGroup.style.display = 'flex';
                        
                        if (deleteType === 'value') {
                            valueGroup.style.display = 'flex';
                            valueLabel.textContent = 'Value';
                            valueInput.placeholder = 'Enter value to delete';
                        } else if (deleteType === 'index') {
                            valueGroup.style.display = 'flex';
                            valueLabel.textContent = 'Index';
                            valueInput.placeholder = 'Enter index to delete';
                        }
                        break;
                        
                    case 'search':
                        searchTypeGroup.style.display = 'flex';
                        valueGroup.style.display = 'flex';
                        valueLabel.textContent = 'Value';
                        valueInput.placeholder = 'Enter value to search';
                        break;
                        
                    case 'traverse':
                        traverseTypeGroup.style.display = 'flex';
                        break;
                }
            }

            updateUI() {
                const listSizeElement = document.getElementById('listSize');

                if (listSizeElement) {
                    listSizeElement.textContent = this.list.length;
                }

                this.renderList();
            }

            renderList() {
                const visualization = document.getElementById('visualization');
                
                if (!visualization) return;
                
                if (this.list.length === 0) {
                    visualization.innerHTML = '<div class="empty-state">Empty doubly linked list</div>';
                    return;
                }

                let html = '';
                
                // Start with left NULL pointer
                html += '<div class="null-pointer">×</div>';
                
                for (let i = 0; i < this.list.length; i++) {
                    let nodeClass = '';
                    
                    // Highlight based on last operation
                    if (this.lastOperation) {
                        if (this.lastOperation.type === 'insert' && i === this.lastOperation.position) {
                            nodeClass = 'success';
                        } else if (this.lastOperation.type === 'search' && i === this.lastOperation.index) {
                            nodeClass = 'active';
                        }
                    }
                    
                    html += '<div class="node">';
                    
                    // Add HEAD/TAIL labels above specific nodes
                    let label = '';
                    if (i === 0 && this.list.length === 1) {
                        label = 'HEAD/TAIL';
                    } else if (i === 0) {
                        label = 'HEAD';
                    } else if (i === this.list.length - 1) {
                        label = 'TAIL';
                    }
                    
                    if (label) {
                        html += '<div style="font-size: 12px; font-weight: 600; color: #1d4ed8; margin-bottom: 5px;">' + label + '</div>';
                    }
                    
                    html += '<div class="position-label">Position ' + i + '</div>';
                    html += '<div class="node-content">';
                    html += '<div class="node-box ' + nodeClass + '">';
                    html += '<div class="node-value">' + this.list[i] + '</div>';
                    html += '<div class="node-pointers">PREV | NEXT</div>';
                    html += '</div>';
                    html += '</div>';
                    html += '</div>';
                    
                    // Add bidirectional arrows between nodes
                    if (i < this.list.length - 1) {
                        html += '<div class="arrows-container">';
                        html += '<div class="arrow forward"></div>';
                        html += '<div class="arrow backward"></div>';
                        html += '</div>';
                    }
                }

                // End with right NULL pointer
                html += '<div class="null-pointer">×</div>';

                visualization.innerHTML = html;
            }
        }

        // Initialize the visualizer when DOM is ready
        const visualizer = new DoublyLinkedListVisualizer();
    </script>
