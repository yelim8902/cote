<!DOCTYPE html>
<!-- saved from url=(0061)https://codes.yalco.kr/ds-algorithm/search/binary-search.html -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이진 탐색 시각화 | 자료구조 시각화</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8f9fa;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            border: 1px solid #e9ecef;
        }

        .control-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
            align-items: end;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-size: 14px;
            font-weight: 600;
            color: #555;
        }

        input[type="text"], select {
            padding: 12px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            min-width: 200px;
        }

        #arrayInput {
            min-width: 400px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #1d4ed8;
            box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(29, 78, 216, 0.3);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #495057;
            border: 2px solid #dee2e6;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #e9ecef;
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .info-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 15px;
        }

        .info-item {
            text-align: center;
            padding: 15px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .info-item h3 {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            margin-bottom: 8px;
        }

        .info-item .value {
            font-size: 18px;
            font-weight: 700;
            color: #333;
        }

        .visualization {
            background: white;
            border-radius: 15px;
            padding: 60px 30px 80px 30px;
            margin-bottom: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            overflow-x: auto;
        }

        .array-element {
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            color: white;
            padding: 15px 10px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            min-width: 60px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.5s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .array-element.left {
            background: linear-gradient(135deg, #999999, #666666);
        }

        .array-element.right {
            background: linear-gradient(135deg, #999999, #666666);
        }

        .array-element.middle {
            background: linear-gradient(135deg, #feca57, #ff9ff3);
            transform: scale(1.1);
        }

        .array-element.target {
            background: linear-gradient(135deg, #26de81, #20bf6b);
            transform: scale(1.15);
        }

        .array-element .index {
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #666;
            font-weight: 400;
        }

        .pointer {
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            font-weight: 600;
            color: #333;
        }

        .step-description {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        .step-description p {
            font-size: 16px;
            color: #333;
            line-height: 1.6;
        }

        .navigation {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .keyboard-hint {
            text-align: center;
            font-size: 14px;
            color: #666;
            margin-top: 10px;
        }

        .result-message {
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .result-message.found {
            background: linear-gradient(135deg, #26de81, #20bf6b);
            color: white;
        }

        .result-message.not-found {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            color: #1d4ed8;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
        .back-link:hover { color: #2563eb; }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .control-panel {
                flex-direction: column;
                align-items: stretch;
            }

            .input-group {
                width: 100%;
            }

            input[type="text"], select {
                min-width: 100%;
            }

            .info-panel {
                grid-template-columns: 1fr;
            }

            .array-element {
                min-width: 50px;
                height: 70px;
                font-size: 14px;
            }

            .navigation {
                flex-direction: column;
                align-items: stretch;
            }
        }
        @media (max-width: 768px) {
            body { overflow-x: hidden; }
            .container { padding: 16px; margin: 0 8px; max-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../../index.html" class="back-link">← 메인으로</a>
        <div class="control-panel">
            <div class="input-group">
                <label for="arrayInput">배열 (쉼표로 구분, 오름차순 정렬)</label>
                <input type="text" id="arrayInput" value="2, 5, 8, 12, 16, 19, 23, 27, 31, 35, 38, 42, 45, 48, 50">
            </div>
            <div class="input-group">
                <label for="targetInput">찾을 값</label>
                <input type="text" id="targetInput" value="38">
            </div>
            <button class="btn-primary" onclick="startSearch()">검색 시작</button>
            <button class="btn-secondary" onclick="resetSearch()">초기화</button>
        </div>

        <div class="info-panel">
            <div class="info-item">
                <h3>알고리즘</h3>
                <div class="value">이진 탐색</div>
            </div>
            <div class="info-item">
                <h3>단계</h3>
                <div class="value" id="stepInfo">0 / 0</div>
            </div>
            <div class="info-item">
                <h3>시간 복잡도</h3>
                <div class="value">O(log n)</div>
            </div>
            <div class="info-item">
                <h3>공간 복잡도</h3>
                <div class="value">O(1)</div>
            </div>
        </div>

        <div class="result-message" id="resultMessage" style="display: none;"></div>

        <div class="visualization" id="visualization">
            <p style="color: #999; font-size: 18px;">"검색 시작"을 눌러 시작하세요</p>
        </div>

        <div class="step-description" id="stepDescription">
            <p>오름차순 정렬된 배열과 찾을 값을 입력한 뒤 "검색 시작"을 눌러 이진 탐색 시각화를 시작하세요.</p>
        </div>

        <div class="navigation">
            <button class="btn-secondary" id="prevBtn" onclick="previousStep()" disabled="">이전</button>
            <button class="btn-secondary" id="nextBtn" onclick="nextStep()" disabled="">다음</button>
        </div>

        <div class="keyboard-hint">
            ← → 방향키로 단계를 이동할 수 있습니다
        </div>
    </div>

    <script>
        class BinarySearchVisualizer {
            constructor() {
                this.array = [];
                this.target = 0;
                this.steps = [];
                this.currentStep = 0;
                this.isSearching = false;
                this.resultFound = false;
                this.resultIndex = -1;
                
                this.initializeEventListeners();
            }

            initializeEventListeners() {
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowLeft') {
                        e.preventDefault();
                        this.previousStep();
                    } else if (e.key === 'ArrowRight') {
                        e.preventDefault();
                        this.nextStep();
                    }
                });

                document.getElementById('arrayInput').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.startSearch();
                    }
                });

                document.getElementById('targetInput').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.startSearch();
                    }
                });
            }

            startSearch() {
                this.parseInput();
                if (!this.validateInput()) return;
                
                this.generateSteps();
                this.currentStep = 0;
                this.isSearching = true;
                this.updateDisplay();
                this.updateNavigationButtons();
            }

            parseInput() {
                const arrayInput = document.getElementById('arrayInput').value;
                const targetInput = document.getElementById('targetInput').value;
                
                this.array = arrayInput.split(',').map(x => parseInt(x.trim())).filter(x => !isNaN(x));
                this.target = parseInt(targetInput.trim());
            }

            validateInput() {
                if (this.array.length === 0) {
                    alert('올바른 배열을 입력하세요');
                    return false;
                }
                
                if (isNaN(this.target)) {
                    alert('탐색할 대상 값을 입력하세요');
                    return false;
                }

                // Check if array is sorted
                for (let i = 1; i < this.array.length; i++) {
                    if (this.array[i] < this.array[i-1]) {
                        alert('배열은 오름차순으로 정렬되어 있어야 합니다');
                        return false;
                    }
                }

                return true;
            }

            generateSteps() {
                this.steps = [];
                this.resultFound = false;
                this.resultIndex = -1;
                
                let left = 0;
                let right = this.array.length - 1;
                
                // Initial step - just show the array without middle pointer
                this.steps.push({
                    left: left,
                    right: right,
                    middle: -1, // No middle pointer initially
                    description: `이진 탐색 시작: ${this.target} 찾기. 탐색 구간 [${left}, ${right}]`,
                    comparison: null,
                    found: false
                });

                while (left <= right) {
                    const middle = Math.floor((left + right) / 2);
                    const middleValue = this.array[middle];
                    
                    if (middleValue === this.target) {
                        this.steps.push({
                            left: left,
                            right: right,
                            middle: middle,
                            description: `인덱스 ${middle}에서 ${this.target} 발견!`,
                            comparison: 'equal',
                            found: true
                        });
                        this.resultFound = true;
                        this.resultIndex = middle;
                        break;
                    } else if (middleValue < this.target) {
                        this.steps.push({
                            left: left,
                            right: right,
                            middle: middle,
                            description: `${middleValue} < ${this.target}. 오른쪽 절반 탐색: [${middle + 1}, ${right}]`,
                            comparison: 'less',
                            found: false
                        });
                        left = middle + 1;
                    } else {
                        this.steps.push({
                            left: left,
                            right: right,
                            middle: middle,
                            description: `${middleValue} > ${this.target}. 왼쪽 절반 탐색: [${left}, ${middle - 1}]`,
                            comparison: 'greater',
                            found: false
                        });
                        right = middle - 1;
                    }
                }

                if (!this.resultFound) {
                    this.steps.push({
                        left: left,
                        right: right,
                        middle: -1,
                        description: `배열에서 ${this.target}을(를) 찾지 못했습니다.`,
                        comparison: null,
                        found: false,
                        notFound: true
                    });
                }
            }

            updateDisplay() {
                this.updateVisualization();
                this.updateStepInfo();
                this.updateStepDescription();
                this.updateResultMessage();
            }

            updateVisualization() {
                const visualization = document.getElementById('visualization');
                visualization.innerHTML = '';

                if (!this.isSearching) {
                    visualization.innerHTML = '<p style="color: #999; font-size: 18px;">"검색 시작"을 눌러 시작하세요</p>';
                    return;
                }

                const step = this.steps[this.currentStep];
                
                this.array.forEach((value, index) => {
                    const element = document.createElement('div');
                    element.className = 'array-element';
                    element.textContent = value;
                    
                    // Add index label
                    const indexLabel = document.createElement('div');
                    indexLabel.className = 'index';
                    indexLabel.textContent = index;
                    element.appendChild(indexLabel);
                    
                    // Apply styling based on current step
                    if (step.found && index === step.middle) {
                        element.classList.add('target');
                        const pointer = document.createElement('div');
                        pointer.className = 'pointer';
                        pointer.textContent = 'FOUND';
                        element.appendChild(pointer);
                    } else if (index === step.middle && step.middle !== -1) {
                        element.classList.add('middle');
                        const pointer = document.createElement('div');
                        pointer.className = 'pointer';
                        pointer.textContent = 'MID';
                        element.appendChild(pointer);
                    } else if (index < step.left || index > step.right) {
                        element.classList.add('left'); // Using left class for eliminated elements
                    }
                    
                    // Add boundary pointers
                    if (index === step.left && step.left === step.right && !step.found) {
                        // When left === right, show both pointers
                        const pointer = document.createElement('div');
                        pointer.className = 'pointer';
                        pointer.textContent = 'L/R';
                        element.appendChild(pointer);
                    } else if (index === step.left && step.left !== step.middle) {
                        const pointer = document.createElement('div');
                        pointer.className = 'pointer';
                        pointer.textContent = 'L';
                        element.appendChild(pointer);
                    } else if (index === step.right && step.right !== step.middle) {
                        const pointer = document.createElement('div');
                        pointer.className = 'pointer';
                        pointer.textContent = 'R';
                        element.appendChild(pointer);
                    }
                    
                    visualization.appendChild(element);
                });
            }

            updateStepInfo() {
                const stepInfo = document.getElementById('stepInfo');
                stepInfo.textContent = `${this.currentStep + 1} / ${this.steps.length}`;
            }

            updateStepDescription() {
                const stepDescription = document.getElementById('stepDescription');
                if (this.isSearching && this.steps.length > 0) {
                    stepDescription.innerHTML = `<p>${this.steps[this.currentStep].description}</p>`;
                } else {
                    stepDescription.innerHTML = '<p>오름차순 정렬된 배열과 찾을 값을 입력한 뒤 "검색 시작"을 눌러 이진 탐색 시각화를 시작하세요.</p>';
                }
            }

            updateResultMessage() {
                const resultMessage = document.getElementById('resultMessage');
                const step = this.steps[this.currentStep];
                
                if (step && step.found) {
                    resultMessage.className = 'result-message found';
                    resultMessage.textContent = `인덱스 ${step.middle}에서 ${this.target} 발견!`;
                    resultMessage.style.display = 'block';
                } else if (step && step.notFound) {
                    resultMessage.className = 'result-message not-found';
                    resultMessage.textContent = `배열에서 ${this.target}을(를) 찾지 못했습니다.`;
                    resultMessage.style.display = 'block';
                } else {
                    resultMessage.style.display = 'none';
                }
            }

            updateNavigationButtons() {
                const prevBtn = document.getElementById('prevBtn');
                const nextBtn = document.getElementById('nextBtn');
                
                if (!this.isSearching) {
                    prevBtn.disabled = true;
                    nextBtn.disabled = true;
                    return;
                }
                
                prevBtn.disabled = this.currentStep === 0;
                nextBtn.disabled = this.currentStep === this.steps.length - 1;
            }

            nextStep() {
                if (this.isSearching && this.currentStep < this.steps.length - 1) {
                    this.currentStep++;
                    this.updateDisplay();
                    this.updateNavigationButtons();
                }
            }

            previousStep() {
                if (this.isSearching && this.currentStep > 0) {
                    this.currentStep--;
                    this.updateDisplay();
                    this.updateNavigationButtons();
                }
            }

            resetSearch() {
                this.isSearching = false;
                this.currentStep = 0;
                this.steps = [];
                this.resultFound = false;
                this.resultIndex = -1;
                
                this.updateDisplay();
                this.updateNavigationButtons();
            }
        }

        // Initialize the visualizer
        const visualizer = new BinarySearchVisualizer();

        // Global functions for button onclick handlers
        function startSearch() {
            visualizer.startSearch();
        }

        function resetSearch() {
            visualizer.resetSearch();
        }

        function nextStep() {
            visualizer.nextStep();
        }

        function previousStep() {
            visualizer.previousStep();
        }
    </script>


</body></html>
