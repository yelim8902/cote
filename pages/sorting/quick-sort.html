<!DOCTYPE html>
<!-- saved from url=(0059)https://codes.yalco.kr/ds-algorithm/sorting/quick-sort.html -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>퀵 정렬 시각화 | 자료구조 시각화</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8f9fa;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            border: 1px solid #e9ecef;
        }

        .control-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
            align-items: end;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-size: 14px;
            font-weight: 600;
            color: #555;
        }

        input[type="text"], select {
            padding: 12px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            min-width: 200px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #1d4ed8;
            box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.1);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(29, 78, 216, 0.3);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #495057;
            border: 2px solid #dee2e6;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #e9ecef;
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .info-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 15px;
        }

        .info-item {
            text-align: center;
            padding: 15px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .info-label {
            font-size: 12px;
            font-weight: 400;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 18px;
            font-weight: 700;
            color: #333;
        }

        .visualization {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            min-height: 300px;
            display: flex;
            align-items: end;
            justify-content: center;
            gap: 4px;
            overflow-x: auto;
        }

        .bar {
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            border-radius: 4px 4px 0 0;
            min-width: 30px;
            display: flex;
            align-items: end;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
            padding: 5px;
            transition: all 0.5s ease;
            cursor: pointer;
            position: relative;
        }

        .bar.pivot {
            background: linear-gradient(135deg, #feca57, #ff9ff3);
            transform: scale(1.2);
            z-index: 10;
        }

        .bar.comparing {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            transform: scale(1.1);
        }

        .bar.less-than-pivot {
            background: linear-gradient(135deg, #26de81, #20bf6b);
            transform: scale(1.05);
        }

        .bar.greater-than-pivot {
            background: linear-gradient(135deg, #ff9500, #ff6348);
            transform: scale(1.05);
        }

        .bar.swapping {
            background: linear-gradient(135deg, #a55eea, #8e44ad);
            transform: scale(1.15);
        }

        .bar.partitioned {
            background: linear-gradient(135deg, #26de81, #20bf6b);
        }

        .navigation {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .step-info {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .step-description {
            font-size: 16px;
            color: #333;
            margin-bottom: 10px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .help-text {
            font-size: 14px;
            color: #666;
            text-align: center;
            margin-top: 20px;
        }

        .partition-indicator {
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 8px solid #e74c3c;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            color: #1d4ed8;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
        .back-link:hover { color: #2563eb; }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            .control-panel {
                flex-direction: column;
            }
            
            input[type="text"], select {
                min-width: auto;
                width: 100%;
            }
            
            .info-panel {
                grid-template-columns: 1fr;
            }
            
            .bar {
                min-width: 25px;
                font-size: 12px;
            }
        }
        @media (max-width: 768px) {
            body { overflow-x: hidden; }
            .container { padding: 16px; margin: 0 8px; max-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../../index.html" class="back-link">← 메인으로</a>
        <div class="control-panel">
            <div class="input-group">
                <label for="arrayInput">배열 값</label>
                <input type="text" id="arrayInput" placeholder="예: 64, 34, 25, 12, 90, 22, 10, 77, 30" value="64, 34, 25, 12, 90, 22, 10, 77, 30">
            </div>
            <button class="btn btn-primary" onclick="quickSort.generateArray()">배열 생성</button>
            <button class="btn btn-secondary" onclick="quickSort.reset()">초기화</button>
        </div>

        <div class="info-panel">
            <div class="info-item">
                <div class="info-label">알고리즘</div>
                <div class="info-value">퀵 정렬</div>
            </div>
            <div class="info-item">
                <div class="info-label">단계</div>
                <div class="info-value" id="stepCounter">0 / 0</div>
            </div>
            <div class="info-item">
                <div class="info-label">시간 복잡도</div>
                <div class="info-value">O(n log n)</div>
            </div>
            <div class="info-item">
                <div class="info-label">공간 복잡도</div>
                <div class="info-value">O(log n)</div>
            </div>
        </div>

        <div class="visualization" id="visualization"></div>

        <div class="navigation">
            <button class="btn btn-secondary" id="prevBtn" onclick="quickSort.previousStep()" disabled="">이전</button>
            <button class="btn btn-primary" id="nextBtn" onclick="quickSort.nextStep()" disabled="">다음</button>
        </div>

        <div class="step-info">
            <div class="step-description" id="stepDescription">배열 값을 입력한 뒤 "배열 생성"을 눌러 시각화를 시작하세요</div>
        </div>

        <div class="help-text">
            ← → 방향키로 단계를 이동할 수 있습니다. 값을 직접 입력하거나 기본 배열로 시작하세요.
        </div>
    </div>

    <script>
        class QuickSortVisualizer {
            constructor() {
                this.originalArray = [];
                this.array = [];
                this.steps = [];
                this.currentStep = 0;
                this.isGenerated = false;
                
                this.initializeEventListeners();
            }

            initializeEventListeners() {
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowLeft') {
                        e.preventDefault();
                        this.previousStep();
                    } else if (e.key === 'ArrowRight') {
                        e.preventDefault();
                        this.nextStep();
                    }
                });

                document.getElementById('arrayInput').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.generateArray();
                    }
                });
            }

            generateArray() {
                const input = document.getElementById('arrayInput').value.trim();
                if (!input) return;

                try {
                    this.originalArray = input.split(',').map(num => {
                        const parsed = parseInt(num.trim());
                        if (isNaN(parsed)) throw new Error('Invalid number');
                        return parsed;
                    });

                    if (this.originalArray.length === 0) throw new Error('Empty array');
                    if (this.originalArray.length > 12) {
                        alert('시각화를 위해 원소는 12개 이하로 입력하세요');
                        return;
                    }

                    this.array = [...this.originalArray];
                    this.generateSteps();
                    this.currentStep = 0;
                    this.isGenerated = true;
                    this.updateVisualization();
                    this.updateUI();
                } catch (error) {
                    alert('쉼표로 구분된 숫자만 입력하세요 (예: 64, 34, 25, 12)');
                }
            }

            generateSteps() {
                this.steps = [];
                const arr = [...this.originalArray];
                const n = arr.length;

                // Initial state
                this.steps.push({
                    array: [...arr],
                    pivot: -1,
                    comparing: -1,
                    lessThanPivot: [],
                    greaterThanPivot: [],
                    swapping: [],
                    partitioned: [],
                    description: `퀵 정렬 시작: ${n}개 요소. 피벗을 선택하고 그 기준으로 나눕니다.`
                });

                this.quickSortRecursive(arr, 0, n - 1);

                // Final state
                this.steps.push({
                    array: [...arr],
                    pivot: -1,
                    comparing: -1,
                    lessThanPivot: [],
                    greaterThanPivot: [],
                    swapping: [],
                    partitioned: Array.from({length: n}, (_, k) => k),
                    description: '퀵 정렬 완료! 모든 원소가 오름차순으로 정렬되었습니다.'
                });
            }

            quickSortRecursive(arr, low, high) {
                if (low < high) {
                    // Choose pivot (last element)
                    const pivotIndex = high;
                    
                    this.steps.push({
                        array: [...arr],
                        pivot: pivotIndex,
                        comparing: -1,
                        lessThanPivot: [],
                        greaterThanPivot: [],
                        swapping: [],
                        partitioned: [],
                        description: `인덱스 ${low}~${high} 정렬. 피벗: ${arr[pivotIndex]} (인덱스 ${pivotIndex}).`
                    });

                    // Partition the array
                    const partitionIndex = this.partition(arr, low, high);

                    // Show partitioned result
                    this.steps.push({
                        array: [...arr],
                        pivot: partitionIndex,
                        comparing: -1,
                        lessThanPivot: [],
                        greaterThanPivot: [],
                        swapping: [],
                        partitioned: [partitionIndex],
                        description: `분할 완료. 피벗 ${arr[partitionIndex]}이(가) 인덱스 ${partitionIndex}에. 왼쪽은 더 작고 오른쪽은 더 큼.`
                    });

                    // Recursively sort left and right subarrays
                    this.quickSortRecursive(arr, low, partitionIndex - 1);
                    this.quickSortRecursive(arr, partitionIndex + 1, high);
                }
            }

            partition(arr, low, high) {
                const pivot = arr[high];
                let i = low - 1; // Index of smaller element

                for (let j = low; j < high; j++) {
                    // Show comparison
                    this.steps.push({
                        array: [...arr],
                        pivot: high,
                        comparing: j,
                        lessThanPivot: [],
                        greaterThanPivot: [],
                        swapping: [],
                        partitioned: [],
                        description: `비교: ${arr[j]}와 피벗 ${pivot}. ${arr[j] <= pivot ? '왼쪽 구간으로 이동.' : '오른쪽 구간에 유지.'}`
                    });

                    if (arr[j] <= pivot) {
                        i++;
                        
                        if (i !== j) {
                            // Show swapping
                            this.steps.push({
                                array: [...arr],
                                pivot: high,
                                comparing: -1,
                                lessThanPivot: [],
                                greaterThanPivot: [],
                                swapping: [i, j],
                                partitioned: [],
                                description: `인덱스 ${i}의 ${arr[i]}와 인덱스 ${j}의 ${arr[j]} 교환.`
                            });

                            [arr[i], arr[j]] = [arr[j], arr[i]];

                            // Show after swap
                            this.steps.push({
                                array: [...arr],
                                pivot: high,
                                comparing: -1,
                                lessThanPivot: Array.from({length: i + 1}, (_, k) => low + k),
                                greaterThanPivot: Array.from({length: j - i}, (_, k) => i + 1 + k),
                                swapping: [],
                                partitioned: [],
                                description: `교환 완료. 왼쪽 구간에 피벗 이하 원소 ${i + 1}개.`
                            });
                        } else {
                            // Show partitions without swap
                            this.steps.push({
                                array: [...arr],
                                pivot: high,
                                comparing: -1,
                                lessThanPivot: Array.from({length: i + 1}, (_, k) => low + k),
                                greaterThanPivot: Array.from({length: j - i}, (_, k) => i + 1 + k),
                                swapping: [],
                                partitioned: [],
                                description: `${arr[j]} ≤ 피벗. 왼쪽 구간 원소 ${i + 1}개.`
                            });
                        }
                    } else {
                        // Show element staying in right partition
                        this.steps.push({
                            array: [...arr],
                            pivot: high,
                            comparing: -1,
                            lessThanPivot: i >= low ? Array.from({length: i - low + 1}, (_, k) => low + k) : [],
                            greaterThanPivot: Array.from({length: j - i}, (_, k) => i + 1 + k),
                            swapping: [],
                            partitioned: [],
                            description: `${arr[j]} > 피벗. 오른쪽 구간에 유지.`
                        });
                    }
                }

                // Place pivot in correct position
                this.steps.push({
                    array: [...arr],
                    pivot: high,
                    comparing: -1,
                    lessThanPivot: [],
                    greaterThanPivot: [],
                    swapping: [i + 1, high],
                    partitioned: [],
                    description: `피벗 ${pivot}을(를) 올바른 위치에 놓기: 인덱스 ${i + 1}과 ${high} 교환.`
                });

                [arr[i + 1], arr[high]] = [arr[high], arr[i + 1]];

                return i + 1;
            }

            updateVisualization() {
                const visualization = document.getElementById('visualization');
                const step = this.steps[this.currentStep];
                
                if (!step) return;

                const maxValue = Math.max(...step.array);
                const minHeight = 40;
                const maxHeight = 200;

                visualization.innerHTML = step.array.map((value, index) => {
                    const height = minHeight + (value / maxValue) * (maxHeight - minHeight);
                    let className = 'bar';
                    
                    if (step.pivot === index) className += ' pivot';
                    if (step.comparing === index) className += ' comparing';
                    if (step.lessThanPivot.includes(index)) className += ' less-than-pivot';
                    if (step.greaterThanPivot.includes(index)) className += ' greater-than-pivot';
                    if (step.swapping.includes(index)) className += ' swapping';
                    if (step.partitioned.includes(index)) className += ' partitioned';

                    let indicator = '';
                    if (step.pivot === index && step.pivot !== -1) {
                        indicator = '<div class="partition-indicator"></div>';
                    }

                    return `<div class="${className}" style="height: ${height}px;">${value}${indicator}</div>`;
                }).join('');
            }

            updateUI() {
                const stepCounter = document.getElementById('stepCounter');
                const stepDescription = document.getElementById('stepDescription');
                const prevBtn = document.getElementById('prevBtn');
                const nextBtn = document.getElementById('nextBtn');

                if (this.isGenerated && this.steps.length > 0) {
                    stepCounter.textContent = `${this.currentStep + 1} / ${this.steps.length}`;
                    stepDescription.textContent = this.steps[this.currentStep].description;
                    
                    prevBtn.disabled = this.currentStep === 0;
                    nextBtn.disabled = this.currentStep === this.steps.length - 1;
                } else {
                    stepCounter.textContent = '0 / 0';
                    stepDescription.textContent = '배열 값을 입력한 뒤 "배열 생성"을 눌러 시각화를 시작하세요';
                    prevBtn.disabled = true;
                    nextBtn.disabled = true;
                }
            }

            nextStep() {
                if (this.isGenerated && this.currentStep < this.steps.length - 1) {
                    this.currentStep++;
                    this.updateVisualization();
                    this.updateUI();
                }
            }

            previousStep() {
                if (this.isGenerated && this.currentStep > 0) {
                    this.currentStep--;
                    this.updateVisualization();
                    this.updateUI();
                }
            }

            reset() {
                this.currentStep = 0;
                this.isGenerated = false;
                this.steps = [];
                this.array = [];
                this.originalArray = [];
                
                document.getElementById('visualization').innerHTML = '';
                this.updateUI();
            }
        }

        const quickSort = new QuickSortVisualizer();
    </script>


</body></html>
