<!DOCTYPE html>

<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>합병 정렬 시각화 | 자료구조 시각화</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8f9fa;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            border: 1px solid #e9ecef;
        }

        .control-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
            align-items: end;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-size: 14px;
            font-weight: 600;
            color: #555;
        }

        input[type="text"], select {
            padding: 12px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            min-width: 200px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #1d4ed8;
            box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.1);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(29, 78, 216, 0.3);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #495057;
            border: 2px solid #dee2e6;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #e9ecef;
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .info-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 15px;
        }

        .info-item {
            text-align: center;
            padding: 15px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .info-label {
            font-size: 12px;
            font-weight: 400;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 18px;
            font-weight: 700;
            color: #333;
        }

        .visualization {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            min-height: 300px;
            display: flex;
            align-items: end;
            justify-content: center;
            gap: 4px;
            overflow-x: auto;
        }

        .bar {
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            border-radius: 4px 4px 0 0;
            min-width: 30px;
            display: flex;
            align-items: end;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
            padding: 5px;
            transition: all 0.5s ease;
            cursor: pointer;
            position: relative;
        }

        .bar.dividing {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            transform: scale(1.1);
        }

        .bar.left-half {
            background: linear-gradient(135deg, #feca57, #ff9ff3);
            transform: scale(1.05);
        }

        .bar.right-half {
            background: linear-gradient(135deg, #ff9500, #ff6348);
            transform: scale(1.05);
        }

        .bar.merging {
            background: linear-gradient(135deg, #26de81, #20bf6b);
            transform: scale(1.15);
        }

        .bar.sorted {
            background: linear-gradient(135deg, #26de81, #20bf6b);
        }

        .navigation {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .step-info {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .step-description {
            font-size: 16px;
            color: #333;
            margin-bottom: 10px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .help-text {
            font-size: 14px;
            color: #666;
            text-align: center;
            margin-top: 20px;
        }

        .divider {
            width: 2px;
            background: #ff6b6b;
            margin: 0 2px;
            height: 220px;
            border-radius: 1px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            color: #1d4ed8;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
        .back-link:hover { color: #2563eb; }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            .control-panel {
                flex-direction: column;
            }
            
            input[type="text"], select {
                min-width: auto;
                width: 100%;
            }
            
            .info-panel {
                grid-template-columns: 1fr;
            }
            
            .bar {
                min-width: 25px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../../index.html" class="back-link">← 메인으로</a>
        <div class="control-panel">
            <div class="input-group">
                <label for="arrayInput">Array Values</label>
                <input type="text" id="arrayInput" placeholder="e.g., 64, 34, 25, 12, 90, 22, 14" value="64, 34, 25, 12, 90, 22, 14">
            </div>
            <button class="btn btn-primary" onclick="mergeSort.generateArray()">Generate Array</button>
            <button class="btn btn-secondary" onclick="mergeSort.reset()">Reset</button>
        </div>

        <div class="info-panel">
            <div class="info-item">
                <div class="info-label">Algorithm</div>
                <div class="info-value">Merge Sort</div>
            </div>
            <div class="info-item">
                <div class="info-label">Step</div>
                <div class="info-value" id="stepCounter">0 / 0</div>
            </div>
            <div class="info-item">
                <div class="info-label">Time Complexity</div>
                <div class="info-value">O(n log n)</div>
            </div>
            <div class="info-item">
                <div class="info-label">Space Complexity</div>
                <div class="info-value">O(n)</div>
            </div>
        </div>

        <div class="visualization" id="visualization"></div>

        <div class="navigation">
            <button class="btn btn-secondary" id="prevBtn" onclick="mergeSort.previousStep()" disabled="">Previous</button>
            <button class="btn btn-primary" id="nextBtn" onclick="mergeSort.nextStep()" disabled="">Next</button>
        </div>

        <div class="step-info">
            <div class="step-description" id="stepDescription">Enter array values and click "Generate Array" to begin visualization</div>
        </div>

        <div class="help-text">
            Use arrow keys (← →) to navigate between steps. Enter custom values or use the default array to start.
        </div>
    </div>

    <script>
        class MergeSortVisualizer {
            constructor() {
                this.originalArray = [];
                this.array = [];
                this.steps = [];
                this.currentStep = 0;
                this.isGenerated = false;
                
                this.initializeEventListeners();
            }

            initializeEventListeners() {
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowLeft') {
                        e.preventDefault();
                        this.previousStep();
                    } else if (e.key === 'ArrowRight') {
                        e.preventDefault();
                        this.nextStep();
                    }
                });

                document.getElementById('arrayInput').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.generateArray();
                    }
                });
            }

            generateArray() {
                const input = document.getElementById('arrayInput').value.trim();
                if (!input) return;

                try {
                    this.originalArray = input.split(',').map(num => {
                        const parsed = parseInt(num.trim());
                        if (isNaN(parsed)) throw new Error('Invalid number');
                        return parsed;
                    });

                    if (this.originalArray.length === 0) throw new Error('Empty array');
                    if (this.originalArray.length > 12) {
                        alert('Please use 12 or fewer elements for better visualization');
                        return;
                    }

                    this.array = [...this.originalArray];
                    this.generateSteps();
                    this.currentStep = 0;
                    this.isGenerated = true;
                    this.updateVisualization();
                    this.updateUI();
                } catch (error) {
                    alert('Please enter valid numbers separated by commas (e.g., 64, 34, 25, 12)');
                }
            }

            generateSteps() {
                this.steps = [];
                const arr = [...this.originalArray];
                const n = arr.length;

                // Initial state
                this.steps.push({
                    array: [...arr],
                    dividing: [],
                    leftHalf: [],
                    rightHalf: [],
                    merging: [],
                    sorted: [],
                    dividers: [],
                    description: `Starting Merge Sort with ${n} elements. We'll recursively divide the array into halves and merge them back in sorted order.`
                });

                this.mergeSortRecursive(arr, 0, n - 1);

                // Final state
                this.steps.push({
                    array: [...arr],
                    dividing: [],
                    leftHalf: [],
                    rightHalf: [],
                    merging: [],
                    sorted: Array.from({length: n}, (_, k) => k),
                    dividers: [],
                    description: 'Merge Sort complete! All elements are now sorted in ascending order.'
                });
            }

            mergeSortRecursive(arr, left, right) {
                if (left >= right) return;

                const mid = Math.floor((left + right) / 2);

                // Show division step
                this.steps.push({
                    array: [...arr],
                    dividing: Array.from({length: right - left + 1}, (_, i) => left + i),
                    leftHalf: [],
                    rightHalf: [],
                    merging: [],
                    sorted: [],
                    dividers: [mid + 0.5],
                    description: `Dividing array from index ${left} to ${right} at position ${mid}. Left: [${left}..${mid}], Right: [${mid + 1}..${right}]`
                });

                // Show left and right halves
                this.steps.push({
                    array: [...arr],
                    dividing: [],
                    leftHalf: Array.from({length: mid - left + 1}, (_, i) => left + i),
                    rightHalf: Array.from({length: right - mid}, (_, i) => mid + 1 + i),
                    merging: [],
                    sorted: [],
                    dividers: [mid + 0.5],
                    description: `Left half: [${arr.slice(left, mid + 1).join(', ')}], Right half: [${arr.slice(mid + 1, right + 1).join(', ')}]`
                });

                // Recursively sort left and right halves
                this.mergeSortRecursive(arr, left, mid);
                this.mergeSortRecursive(arr, mid + 1, right);

                // Merge the sorted halves
                this.merge(arr, left, mid, right);
            }

            merge(arr, left, mid, right) {
                const leftArr = arr.slice(left, mid + 1);
                const rightArr = arr.slice(mid + 1, right + 1);

                // Show arrays to be merged
                this.steps.push({
                    array: [...arr],
                    dividing: [],
                    leftHalf: Array.from({length: mid - left + 1}, (_, i) => left + i),
                    rightHalf: Array.from({length: right - mid}, (_, i) => mid + 1 + i),
                    merging: [],
                    sorted: [],
                    dividers: [],
                    description: `Merging sorted halves: [${leftArr.join(', ')}] and [${rightArr.join(', ')}]`
                });

                let i = 0, j = 0, k = left;

                // Merge process
                while (i < leftArr.length && j < rightArr.length) {
                    const mergeIndices = Array.from({length: right - left + 1}, (_, idx) => left + idx);
                    
                    if (leftArr[i] <= rightArr[j]) {
                        arr[k] = leftArr[i];
                        this.steps.push({
                            array: [...arr],
                            dividing: [],
                            leftHalf: [],
                            rightHalf: [],
                            merging: [k],
                            sorted: [],
                            dividers: [],
                            description: `Comparing ${leftArr[i]} ≤ ${rightArr[j]}: placing ${leftArr[i]} at position ${k}`
                        });
                        i++;
                    } else {
                        arr[k] = rightArr[j];
                        this.steps.push({
                            array: [...arr],
                            dividing: [],
                            leftHalf: [],
                            rightHalf: [],
                            merging: [k],
                            sorted: [],
                            dividers: [],
                            description: `Comparing ${leftArr[i]} > ${rightArr[j]}: placing ${rightArr[j]} at position ${k}`
                        });
                        j++;
                    }
                    k++;
                }

                // Copy remaining elements from left array
                while (i < leftArr.length) {
                    arr[k] = leftArr[i];
                    this.steps.push({
                        array: [...arr],
                        dividing: [],
                        leftHalf: [],
                        rightHalf: [],
                        merging: [k],
                        sorted: [],
                        dividers: [],
                        description: `Copying remaining element ${leftArr[i]} from left array to position ${k}`
                    });
                    i++;
                    k++;
                }

                // Copy remaining elements from right array
                while (j < rightArr.length) {
                    arr[k] = rightArr[j];
                    this.steps.push({
                        array: [...arr],
                        dividing: [],
                        leftHalf: [],
                        rightHalf: [],
                        merging: [k],
                        sorted: [],
                        dividers: [],
                        description: `Copying remaining element ${rightArr[j]} from right array to position ${k}`
                    });
                    j++;
                    k++;
                }

                // Show merged result
                const mergedIndices = Array.from({length: right - left + 1}, (_, idx) => left + idx);
                this.steps.push({
                    array: [...arr],
                    dividing: [],
                    leftHalf: [],
                    rightHalf: [],
                    merging: [],
                    sorted: mergedIndices,
                    dividers: [],
                    description: `Merged result: [${arr.slice(left, right + 1).join(', ')}] from indices ${left} to ${right}`
                });
            }

            updateVisualization() {
                const visualization = document.getElementById('visualization');
                const step = this.steps[this.currentStep];
                
                if (!step) return;

                const maxValue = Math.max(...step.array);
                const minHeight = 40;
                const maxHeight = 200;

                let html = '';
                
                for (let i = 0; i < step.array.length; i++) {
                    const value = step.array[i];
                    const height = minHeight + (value / maxValue) * (maxHeight - minHeight);
                    let className = 'bar';
                    
                    if (step.dividing.includes(i)) className += ' dividing';
                    if (step.leftHalf.includes(i)) className += ' left-half';
                    if (step.rightHalf.includes(i)) className += ' right-half';
                    if (step.merging.includes(i)) className += ' merging';
                    if (step.sorted.includes(i)) className += ' sorted';

                    html += `<div class="${className}" style="height: ${height}px;">${value}</div>`;
                    
                    // Add divider if needed
                    if (step.dividers.includes(i + 0.5)) {
                        html += '<div class="divider"></div>';
                    }
                }

                visualization.innerHTML = html;
            }

            updateUI() {
                const stepCounter = document.getElementById('stepCounter');
                const stepDescription = document.getElementById('stepDescription');
                const prevBtn = document.getElementById('prevBtn');
                const nextBtn = document.getElementById('nextBtn');

                if (this.isGenerated && this.steps.length > 0) {
                    stepCounter.textContent = `${this.currentStep + 1} / ${this.steps.length}`;
                    stepDescription.textContent = this.steps[this.currentStep].description;
                    
                    prevBtn.disabled = this.currentStep === 0;
                    nextBtn.disabled = this.currentStep === this.steps.length - 1;
                } else {
                    stepCounter.textContent = '0 / 0';
                    stepDescription.textContent = 'Enter array values and click "Generate Array" to begin visualization';
                    prevBtn.disabled = true;
                    nextBtn.disabled = true;
                }
            }

            nextStep() {
                if (this.isGenerated && this.currentStep < this.steps.length - 1) {
                    this.currentStep++;
                    this.updateVisualization();
                    this.updateUI();
                }
            }

            previousStep() {
                if (this.isGenerated && this.currentStep > 0) {
                    this.currentStep--;
                    this.updateVisualization();
                    this.updateUI();
                }
            }

            reset() {
                this.currentStep = 0;
                this.isGenerated = false;
                this.steps = [];
                this.array = [];
                this.originalArray = [];
                
                document.getElementById('visualization').innerHTML = '';
                this.updateUI();
            }
        }

        const mergeSort = new MergeSortVisualizer();
    </script>


</body></html>
